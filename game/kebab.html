<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kebabspettet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
:root{--ground:#241612;--panel:rgba(28,16,12,.9);--cream:#FFF3E0;--dim:#D9B99B;--accent:#FF7A1A;--accent-shadow:#9E4207;--btn-text:#2B1000;--card:#4A2C20;--card-dk:#241612;--line:#6B4433;--how-cols:3;color-scheme:dark}
</style>
<script src="lib/core.js"></script>
</head>
<body>
<div id="stage"><div id="box"><div id="frame">
<div id="menu" class="ov">
  <h1 class="logo" style="font-size:clamp(38px,12vw,58px)">KEBABSPETTET</h1>
  <p class="sub">Skär när den grillade sidan är fram. Långt drag = tjock skiva. Fyll pitan exakt till linjen utan spill, välj rätt sås. Spettet varvar upp.</p>
  <div class="how" aria-label="Så här spelar du">
    <div><b>⇣</b>skär (längd = tjocklek)</div>
    <div><b>⇠ ⇢ ⇡</b>sås: mild, stark, allt</div>
    <div><b>—</b>fyll till linjen, spill inte</div>
  </div>
  <button class="btn" id="bPlay">SKÄR</button>
  <div class="row">
    <button class="btn sec" id="bDaily">Dagens kö</button>
    <button class="btn sec" id="bDuel">Turas om · 2 spelare</button>
  </div>
  <div class="row">
    <button class="btn sec" id="bHap">Vibration: på</button>
    <button class="btn sec" id="bSnd">Ljud: på</button>
  </div>
  <p class="small" id="bestLine"></p>
  <p class="small" id="challengeLine" hidden></p>
</div>
<div id="over" class="ov" hidden>
  <p class="tag" id="overTag">STÄNGT</p>
  <p class="big" id="overScore">0</p>
  <p class="sub" id="overSub"></p>
  <button class="btn" id="bAgain">IGEN</button>
  <button class="btn" id="bNextPlayer" hidden>SPELARE 2 – SKÄR</button>
  <div class="row">
    <button class="btn sec" id="bShare">Utmana en vän</button>
    <button class="btn sec" id="bMenu">Meny</button>
  </div>
  <input id="linkbox" class="linkbox" hidden readonly aria-label="Utmaningslänk">
  <p class="small" id="overHint">Tryck var som helst för att köra igen</p>
</div>
<div id="toast" role="status"></div>
</div></div></div>
<script>
(() => {
'use strict';
const C = Core, $ = C.$;
const S = C.store('kebab');
C.haptics.on = S.get('haptics', true); C.audio.on = S.get('sound', true);
const SKINS = ['#F5C6A0', '#C68642', '#8D5524', '#FFDBAC', '#E0AC69', '#B5E7A0', '#9AD0F5', '#F5A3C7'];
const SAUCES = { left: 'MILD', right: 'STARK', up: 'ALLT' };
const SAY = { intro: ['EN KEBAB. FULL.', 'TILL LINJEN, TACK', 'JAG ÄR HANGRY', 'MYCKET KÖTT!'], good: ['SNYGGT', 'MER', 'MMM'], raw: ['RÅTT?! BLÄ', 'DET ÄR ROSA!'], spill: ['DET RANN ÖVER!', 'SPILL!'], serve: ['TACK! GUD VAD GOTT', 'PERFEKT KEBAB', 'ÄNTLIGEN'], wrong: ['FEL SÅS…', 'JAG SA STARK'], slow: ['JAG GÅR TILL MAX', 'ZZZ…'] };
const WIN = { lo: 0.3, hi: 0.7, plo: 0.44, phi: 0.56 };
const DUEL_N = 5;
const G = { screen: 'menu', mode: 'free', seed: '', order: 0, phase: 0, period: 2.2, fill: 0, target: 100, patience: 0, patienceMax: 12, slices: [], falling: [], lives: 3, score: 0, combo: 0, state: 'cut', sauce: 'left', face: null, bubble: null, anim: null, overReadyAt: 0, duel: { turn: 0, scores: [0, 0] }, challengeSeed: null, challengeScore: 0, cutCd: 0, knife: 0, served: 0, perfects: 0, hint: true };
const spitX = () => g.W / 2 - 40, spitTop = () => 150, spitBot = () => g.H * 0.55, pitaX = () => g.W / 2 - 40, pitaY = () => g.H - 130;
function say(text, secs = 1.4) { G.bubble = { text, until: g.t + secs, born: g.t }; }
const cooked = ph => ph >= WIN.lo && ph <= WIN.hi;

function startRun(mode, seed) {
  G.mode = mode; G.seed = seed; G.screen = 'play'; G.order = 0; G.lives = 3; G.score = 0; G.combo = 0; G.anim = null; G.served = 0; G.perfects = 0; G.hint = !S.get('played', false);
  C.ui.hideAll(); newOrder();
}
function startGame(mode) {
  const seed = mode === 'daily' ? 'daily-' + C.todayStr() : mode === 'challenge' ? G.challengeSeed : C.newSeed();
  if (mode === 'duel') G.duel = { turn: 0, scores: [0, 0] };
  startRun(mode, seed);
  C.ui.toast(mode === 'duel' ? 'Spelare 1 gör ' + DUEL_N + ' kebaber, sedan spelare 2 samma ordrar.' : 'Swipa ner när spettet är brunt framåt. Långt drag = tjock skiva.', 2600);
}
function newOrder() {
  const i = G.order, r = C.rngAt(G.seed, i), a = r(), b = r(), c = r();
  G.target = 80 + Math.floor(a * 6) * 10; G.fill = 0; G.slices = []; G.falling = []; G.state = 'cut'; G.phase = b; G.period = Math.max(1.0, 2.2 - 0.12 * i);
  G.patienceMax = Math.max(9, 16 - 0.4 * i); G.patience = G.patienceMax; G.sauce = ['left', 'right', 'up'][Math.floor(c * 3)]; G.cutCd = 0;
  G.face = { skin: SKINS[i % SKINS.length], blink: 0 };
  say(C.pick(SAY.intro) + ' ' + SAUCES[G.sauce] + ' SÅS.', 2.4);
}
function cut(len) {
  if (G.state !== 'cut' || G.anim || G.cutCd > 0) return;
  G.cutCd = 0.28; G.knife = 1;
  const ph = G.phase, thick = C.clamp(Math.round(len / 3), 8, 40), raw = !cooked(ph), perfect = ph >= WIN.plo && ph <= WIN.phi;
  G.falling.push({ y: spitTop() + 40 + Math.random() * 60, t: 0, thick, raw, perfect });
  C.haptics.medium(); C.audio.noise(0.12, 0.2, 2500); C.audio.tone(900, 0.06, 'square', 0.04, -500);
  if (G.hint) { G.hint = false; S.set('played', true); }
}
function landSlice(sl) {
  if (sl.raw) { G.lives--; G.combo = 0; say(C.pick(SAY.raw), 1.4); g.fx.text(pitaX(), pitaY() - 90, 'RÅTT!', '#FF6B6B', 30, 1.2); g.fx.shake = 10; C.haptics.fail(); C.audio.buzz(); if (G.lives <= 0) { G.anim = { t: 0, dur: 0.8, after: showOver }; } return; }
  G.fill += sl.thick; G.slices.push(sl);
  if (G.fill > G.target * 1.1) { G.lives--; G.combo = 0; say(C.pick(SAY.spill), 1.4); g.fx.text(pitaX(), pitaY() - 90, 'SPILL!', '#FF6B6B', 30, 1.2); g.fx.burst(pitaX(), pitaY() - 40, 14, ['#8A4B22', '#C8873E'], 220, 0.8); g.fx.shake = 10; C.haptics.fail(); C.audio.splash(); if (G.lives <= 0) { G.anim = { t: 0, dur: 0.8, after: showOver }; return; } G.fill = 0; G.slices = []; return; }
  let pts = sl.perfect ? 10 : 5; if (sl.perfect) { G.combo++; pts += 2 * Math.min(G.combo, 10); } else G.combo = 0;
  G.score += pts; g.fx.text(pitaX() + 70, pitaY() - 60 - sl.thick, (sl.perfect ? 'PERFEKT +' : '+') + pts, sl.perfect ? '#FF7A1A' : '#FFF3E0', sl.perfect ? 20 : 15, 0.7);
  C.haptics.tick(); C.audio.tone(200 + G.fill * 2, 0.08, 'triangle', 0.08);
  if (G.fill >= G.target * 0.95) { G.state = 'sauce'; say('SÅS? ' + SAUCES[G.sauce] + '!', 3); C.haptics.light(); C.audio.ding(); }
}
function chooseSauce(dir) {
  if (G.state !== 'sauce' || G.anim) return;
  const ok = dir === G.sauce; const acc = Math.max(0, 1 - Math.abs(G.fill - G.target) / (G.target * 0.1));
  let pts = Math.round(50 * acc) + (ok ? 30 : 0) + Math.round(G.patience / G.patienceMax * 20);
  if (acc >= 0.9 && ok) { G.perfects++; pts += 20; }
  G.score += pts; G.served++;
  say(ok ? C.pick(SAY.serve) : C.pick(SAY.wrong), 1.6);
  g.fx.text(pitaX(), pitaY() - 110, (ok ? 'SERVERAD! ' : 'FEL SÅS, MEN OK. ') + '+' + pts, ok ? '#FF7A1A' : '#FFF3E0', 24, 1.4);
  g.fx.burst(pitaX(), pitaY() - 60, 20, ['#FF7A1A', '#FFF3E0', '#62D26F'], 300, 0.9);
  if (ok) { C.haptics.success(G.perfects || 1); C.audio.chord(); } else { C.haptics.light(); C.audio.pop(); }
  G.state = 'serve'; G.anim = { t: 0, dur: 0.6, after: () => { G.order++; if (G.mode === 'duel' && G.order >= DUEL_N) { showOver(); return; } newOrder(); } };
}
function update(dt) {
  if (G.screen !== 'play') return;
  if (G.face) { G.face.blink = Math.max(0, G.face.blink - dt); if (Math.random() < dt * 0.25) G.face.blink = 0.14; }
  if (G.cutCd > 0) G.cutCd -= dt; if (G.knife > 0) G.knife = Math.max(0, G.knife - dt * 5);
  G.phase = (G.phase + dt / G.period) % 1;
  for (const f of G.falling) { f.t += dt; f.y += (300 + f.t * 900) * dt; if (f.y >= pitaY() - 30 - G.fill * 0.9) { f.done = true; landSlice(f); } }
  G.falling = G.falling.filter(f => !f.done);
  if (G.anim) { G.anim.t += dt; if (G.anim.t >= G.anim.dur) { const a = G.anim; G.anim = null; a.after(); } return; }
  if (G.state === 'cut' || G.state === 'sauce') { G.patience -= dt; if (G.patience <= 0) { G.lives--; G.combo = 0; say(C.pick(SAY.slow), 1.6); g.fx.text(pitaX(), pitaY() - 90, 'KUNDEN GICK', '#FF6B6B', 24, 1.2); C.haptics.fail(); C.audio.buzz(); if (G.lives <= 0) { G.anim = { t: 0, dur: 0.8, after: showOver }; return; } G.order++; newOrder(); } }
}
function showOver() {
  G.screen = 'over'; G.overReadyAt = performance.now() + 500;
  if (G.mode === 'duel') {
    G.duel.scores[G.duel.turn] = G.score;
    if (G.duel.turn === 0) { C.ui.setText('overTag', 'SPELARE 1 KLAR'); C.ui.setText('overScore', String(G.score)); C.ui.setText('overSub', 'Spelare 2 får samma ordrar. Slå ' + G.score + '!'); $('bAgain').hidden = true; $('bNextPlayer').hidden = false; $('bShare').hidden = true; $('overHint').hidden = true; }
    else { const [a, b] = G.duel.scores, w = a === b ? 0 : a > b ? 1 : 2; C.ui.setText('overTag', w ? 'SPELARE ' + w + ' VANN' : 'OAVGJORT'); C.ui.setText('overScore', a + ' – ' + b); C.ui.setText('overSub', 'Samma spett, samma kunder. Ny duell?'); $('bAgain').hidden = false; $('bAgain').textContent = 'NY DUELL'; $('bNextPlayer').hidden = true; $('bShare').hidden = true; $('overHint').hidden = false; }
    $('linkbox').hidden = true; C.ui.show('over'); return;
  }
  const key = G.mode === 'daily' ? 'daily.' + C.todayStr() : 'best';
  const best = S.get(key, 0), rec = G.score > best; if (rec) S.set(key, G.score);
  C.ui.setText('overTag', (G.mode === 'daily' ? 'DAGENS KÖ · ' : G.mode === 'challenge' ? 'UTMANING · ' : '') + 'KIOSKEN STÄNGDE');
  C.ui.setText('overScore', String(G.score));
  let sub = (rec ? 'NYTT REKORD!' : 'Bästa: ' + best) + ' · ' + G.served + ' kebaber · ' + G.perfects + ' perfekta';
  if (G.mode === 'challenge') sub += G.score > G.challengeScore ? ' · Du slog din vän (' + G.challengeScore + ')! 🏆' : ' · Din vän hade ' + G.challengeScore + '.';
  C.ui.setText('overSub', sub);
  $('bAgain').hidden = false; $('bAgain').textContent = 'IGEN'; $('bNextPlayer').hidden = true; $('bShare').hidden = false; $('overHint').hidden = false; $('linkbox').hidden = true;
  if (rec && best > 0) { C.haptics.win(); C.audio.fanfare(); }
  updateBest(); C.ui.show('over');
}
function restart() {
  if (G.mode === 'duel' && G.duel.turn === 0 && G.screen === 'over') { G.duel.turn = 1; startRun('duel', G.seed); C.ui.toast('Spelare 2: samma ordrar. Skär!', 1600); return; }
  if (G.mode === 'duel') { startGame('duel'); return; }
  startGame(G.mode);
}
function goMenu() { G.screen = 'menu'; C.ui.hideAll(); C.ui.show('menu'); updateBest(); }
function updateBest() { const b = S.get('best', 0), d = S.get('daily.' + C.todayStr(), 0); C.ui.setText('bestLine', (b ? 'Bästa: ' + b : 'Inget rekord än') + (d ? ' · Dagens: ' + d : '')); }
function share() { const url = location.href.split('#')[0] + '#s=' + encodeURIComponent(G.seed) + '&t=' + G.score; C.share({ text: 'KEBABSPETTET 🥙 ' + G.score + ' p, ' + G.served + ' kebaber. Samma spett, slå mig:', url, linkboxId: 'linkbox' }); }

function render(ctx) {
  const W = g.W, H = g.H;
  ctx.save(); g.fx.applyShake(ctx);
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#241612'); gr.addColorStop(1, '#4A2C20'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  if (G.screen !== 'menu') {
    // counter
    ctx.fillStyle = '#8B5A2B'; ctx.fillRect(0, pitaY() + 30, W, H - pitaY() - 30); ctx.fillStyle = '#A5713A'; ctx.fillRect(0, pitaY() + 30, W, 6);
    // heat lamp
    const sx = spitX(), top = spitTop(), bot = spitBot();
    ctx.save(); ctx.globalAlpha = 0.18 + 0.05 * Math.sin(g.t * 8); ctx.fillStyle = '#FF7A1A'; ctx.beginPath(); ctx.moveTo(sx + 70, top); ctx.lineTo(sx + 130, top); ctx.lineTo(sx + 60, bot); ctx.lineTo(sx - 60, bot); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#FF7A1A'; C.rrect(ctx, sx + 68, top - 10, 22, bot - top + 20, 8); ctx.fill(); ctx.fillStyle = '#FFD166'; for (let y = top; y < bot; y += 24) ctx.fillRect(sx + 74, y, 10, 12);
    // spit (tapered), colored by cook phase
    const ph = G.phase, cookAmt = cooked(ph) ? 1 - Math.abs(ph - (WIN.lo + WIN.hi) / 2) / ((WIN.hi - WIN.lo) / 2) * 0.5 : 0;
    const rows = 22, rh = (bot - top) / rows;
    for (let r = 0; r < rows; r++) {
      const y = top + r * rh, wTop = 84 - r * 1.6, wBot = 84 - (r + 1) * 1.6;
      const stripe = ((r + Math.floor(ph * 8)) % 2 === 0);
      const base = cookAmt > 0 ? mix('#E9A07A', '#7A3E1A', cookAmt) : (ph < WIN.lo ? mix('#E9A07A', '#B8663A', ph / WIN.lo) : mix('#7A3E1A', '#E9A07A', (ph - WIN.hi) / (1 - WIN.hi)));
      ctx.fillStyle = stripe ? base : shade(base, -18);
      ctx.beginPath(); ctx.moveTo(sx - wTop / 2, y); ctx.lineTo(sx + wTop / 2, y); ctx.lineTo(sx + wBot / 2, y + rh + 1); ctx.lineTo(sx - wBot / 2, y + rh + 1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + 0.25 * Math.max(0, Math.sin((ph + r * 0.02) * Math.PI * 2))) + ')'; ctx.fillRect(sx - wTop / 2 + 6, y, 12, rh);
    }
    ctx.fillStyle = '#555'; ctx.fillRect(sx - 4, top - 60, 8, bot - top + 80); ctx.fillStyle = '#333'; ctx.fillRect(sx - 30, top - 66, 60, 10);
    // cook indicator
    const cx = cooked(ph); C.text(ctx, cx ? (ph >= WIN.plo && ph <= WIN.phi ? 'PERFEKT NU!' : 'GRILLAD ⇣') : 'VÄNTA…', sx, top - 84, 18, cx ? '#FF7A1A' : '#D9B99B');
    // phase ring
    ctx.beginPath(); ctx.arc(sx - 92, top - 84, 14, -Math.PI / 2, -Math.PI / 2 + ph * Math.PI * 2); ctx.lineWidth = 6; ctx.strokeStyle = cx ? '#FF7A1A' : 'rgba(255,255,255,.25)'; ctx.stroke();
    // knife
    const kx = sx + 46, ky = top + 20 + G.knife * (bot - top - 40); ctx.fillStyle = '#E8E8E8'; C.rrect(ctx, kx, ky, 12, 90, 3); ctx.fill(); ctx.fillStyle = '#1B1430'; C.rrect(ctx, kx - 4, ky - 30, 20, 34, 6); ctx.fill();
    // falling slices
    for (const f of G.falling) { ctx.fillStyle = f.raw ? '#E9A07A' : '#7A3E1A'; ctx.save(); ctx.translate(sx + Math.sin(f.t * 12) * 6, f.y); ctx.rotate(Math.sin(f.t * 9) * 0.3); C.rrect(ctx, -40, -f.thick / 2, 80, f.thick, 4); ctx.fill(); ctx.restore(); }
    // pita
    const px = pitaX(), py = pitaY();
    ctx.fillStyle = '#E8C37E'; ctx.beginPath(); ctx.moveTo(px - 90, py); ctx.quadraticCurveTo(px - 100, py - 150, px, py - 150); ctx.quadraticCurveTo(px + 100, py - 150, px + 90, py); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#F6DCA6'; ctx.beginPath(); ctx.moveTo(px - 78, py - 4); ctx.quadraticCurveTo(px - 86, py - 130, px, py - 132); ctx.quadraticCurveTo(px + 86, py - 130, px + 78, py - 4); ctx.closePath(); ctx.fill();
    let fy = py - 8; for (const sl of G.slices) { const h = sl.thick * 0.9; fy -= h; ctx.fillStyle = sl.perfect ? '#6B3413' : '#7A3E1A'; C.rrect(ctx, px - 60 + Math.sin(fy) * 6, fy, 120, h - 1, 4); ctx.fill(); }
    const lineY = py - 8 - G.target * 0.9; ctx.setLineDash([6, 5]); ctx.strokeStyle = '#FFF3E0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px - 100, lineY); ctx.lineTo(px + 100, lineY); ctx.stroke(); ctx.setLineDash([]);
    C.text(ctx, 'LINJEN', px + 110, lineY, 11, '#FFF3E0', 'left', C.F.ui, false);
    const over = py - 8 - G.target * 0.99; ctx.strokeStyle = 'rgba(255,107,107,.6)'; ctx.beginPath(); ctx.moveTo(px - 100, over); ctx.lineTo(px + 100, over); ctx.stroke();
    ctx.fillStyle = '#E8C37E'; ctx.beginPath(); ctx.moveTo(px - 90, py); ctx.quadraticCurveTo(px, py + 30, px + 90, py); ctx.closePath(); ctx.fill();
    C.text(ctx, Math.round(G.fill / G.target * 100) + '%', px, py + 16, 16, '#2B1000', 'center', C.F.display, false);
    if (G.state === 'sauce') { ctx.save(); ctx.globalAlpha = 0.85; C.rrect(ctx, px - 120, py - 240, 240, 60, 14); ctx.fillStyle = '#FFF3E0'; ctx.fill(); ctx.restore(); C.text(ctx, '⇠ MILD   ⇡ ALLT   STARK ⇢', px, py - 210, 16, '#2B1000', 'center', C.F.display, false); }
    // customer at right
    const f = G.face, fx0 = W - 74, fy0 = H * 0.5;
    ctx.beginPath(); ctx.arc(fx0, fy0, 54, 0, Math.PI * 2); ctx.fillStyle = f.skin; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,12,40,.5)'; ctx.stroke();
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(fx0 + s * 20, fy0 - 12, 9, f.blink > 0 ? 1 : 10, 0, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); if (f.blink <= 0) { ctx.beginPath(); ctx.arc(fx0 + s * 20 - 3, fy0 - 10, 4, 0, Math.PI * 2); ctx.fillStyle = '#1B1430'; ctx.fill(); } }
    const hungry = G.patience / G.patienceMax; ctx.lineWidth = 3; ctx.strokeStyle = '#1B1430'; ctx.beginPath(); if (hungry > 0.5) ctx.arc(fx0, fy0 + 14, 14, 0.15 * Math.PI, 0.85 * Math.PI); else ctx.arc(fx0, fy0 + 30, 14, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
    C.rrect(ctx, fx0 - 40, fy0 + 66, 80, 8, 4); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fill(); C.rrect(ctx, fx0 - 40, fy0 + 66, 80 * Math.max(0, hungry), 8, 4); ctx.fillStyle = hungry < 0.3 ? '#FF6B6B' : '#62D26F'; ctx.fill();
    C.text(ctx, 'TÅLAMOD', fx0, fy0 + 86, 10, '#D9B99B', 'center', C.F.ui, false);
    if (G.bubble && G.bubble.until > g.t) { const b = G.bubble, pop = Math.min(1, (g.t - b.born) / 0.12), bw = Math.min(W - 24, 30 + b.text.length * 10), bx = Math.min(W - bw / 2 - 8, fx0), by = fy0 - 100; ctx.save(); ctx.translate(bx, by); ctx.scale(pop, pop); ctx.translate(-bx, -by); C.rrect(ctx, bx - bw / 2, by - 18, bw, 36, 12); ctx.fillStyle = '#FFF3E0'; ctx.fill(); C.text(ctx, b.text, bx, by + 1, 15, '#2B1000', 'center', C.F.display, false); ctx.restore(); }
    // HUD
    if (G.mode === 'duel') C.text(ctx, 'SPELARE ' + (G.duel.turn + 1) + ' · KEBAB ' + (G.order + 1) + '/' + DUEL_N, W / 2, 26, 16, G.duel.turn === 0 ? '#FF7A1A' : '#9AD0F5');
    C.text(ctx, String(G.score), W / 2, G.mode === 'duel' ? 54 : 34, 36, '#FFF3E0');
    C.text(ctx, '♥'.repeat(Math.max(0, G.lives)) + '♡'.repeat(Math.max(0, 3 - G.lives)), 16, 26, 20, '#FF6B6B', 'left');
    if (G.combo >= 2) C.text(ctx, 'x' + G.combo, W - 20, 26, 24, '#FF7A1A', 'right');
    C.text(ctx, 'KUND ' + (G.order + 1) + ' · ' + G.target + ' g', 16, 48, 12, '#D9B99B', 'left', C.F.ui);
    if (G.hint && G.state === 'cut') C.text(ctx, 'SWIPA NER NÄR DET STÅR "GRILLAD"', W / 2 - 40, spitBot() + 40, 13, '#D9B99B', 'center', C.F.ui, false);
    C.text(ctx, 'MENY', 16, H - 20, 12, 'rgba(255,243,224,.5)', 'left', C.F.ui, false);
  }
  g.fx.draw(ctx); ctx.restore();
}
