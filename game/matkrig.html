<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Matkriget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
:root{--ground:#1E1B2E;--panel:rgba(22,18,36,.9);--cream:#FFF7EC;--dim:#B9B4CC;--accent:#FF5E5B;--accent-shadow:#A82C2A;--btn-text:#2B0A0A;--card:#2F2A47;--card-dk:#1E1B2E;--line:#4B4470;--how-cols:3;color-scheme:dark}
</style>
<script src="lib/core.js"></script>
</head>
<body>
<div id="stage"><div id="box"><div id="frame">
<div id="menu" class="ov">
  <h1 class="logo">MATKRIGET</h1>
  <p class="sub">Kasta mat i motståndarens ansikte. Träff = splat som täcker deras halva av skärmen. Fem träffar vinner. Ducka i sidled.</p>
  <div class="how" aria-label="Så här spelar du">
    <div><b>⇡</b>kasta (nedre spelaren)</div>
    <div><b>⇠ ⇢</b>ducka och sikta</div>
    <div><b>🎂</b>tårta = jättesplat</div>
  </div>
  <button class="btn" id="bPlay">MOT KOCKEN</button>
  <div class="row">
    <button class="btn sec" id="bDuel">Duell · delad skärm</button>
  </div>
  <div class="row">
    <button class="btn sec" id="bHap">Vibration: på</button>
    <button class="btn sec" id="bSnd">Ljud: på</button>
  </div>
  <p class="small" id="bestLine"></p>
</div>
<div id="over" class="ov" hidden>
  <p class="tag" id="overTag">SLUT</p>
  <p class="big" id="overScore">0</p>
  <p class="sub" id="overSub"></p>
  <button class="btn" id="bAgain">REVANSCH</button>
  <div class="row">
    <button class="btn sec" id="bMenu">Meny</button>
  </div>
  <p class="small">Tryck var som helst för att köra igen</p>
</div>
<div id="toast" role="status"></div>
</div></div></div>
<script>
(() => {
'use strict';
const C = Core, $ = C.$;
const S = C.store('matkrig');
C.haptics.on = S.get('haptics', true); C.audio.on = S.get('sound', true);
const FOODS = [
  { e: '🍅', name: 'TOMAT', speed: 0.55, splat: 2.0, size: 90, color: 'rgba(230,57,70,.85)', w: 1 },
  { e: '🎂', name: 'TÅRTA', speed: 0.9, splat: 3.2, size: 150, color: 'rgba(255,214,231,.92)', w: 1 },
  { e: '🫛', name: 'ÄRTA', speed: 0.35, splat: 1.0, size: 50, color: 'rgba(98,210,111,.85)', w: 1 },
  { e: '🍝', name: 'SPAGHETTI', speed: 0.7, splat: 2.4, size: 120, color: 'rgba(255,193,69,.85)', w: 1, wide: true },
  { e: '🥚', name: 'ÄGG', speed: 0.5, splat: 2.2, size: 100, color: 'rgba(255,241,193,.9)', w: 1 },
];
const LANES = [-110, 0, 110], TIME = 45, MAXHITS = 5;
const G = { screen: 'menu', mode: 'solo', players: [], shots: [], clock: TIME, anim: null, overReadyAt: 0, winner: -1, koTimer: 0 };
const faceY = p => p.idx === 0 ? g.H * 0.8 : g.H * 0.2;
const halfTop = p => p.idx === 0 ? g.H / 2 : 0;

function mkPlayer(idx, ai) { return { idx, ai, lane: 1, x: g.W / 2, hits: 0, landed: 0, cool: 0, ammo: pickFood(), next: pickFood(), splats: [], hitT: 0, aiT: 0.8 + Math.random() * 0.6, aiLane: 1, aiMoveT: 0, expr: 0, skin: idx === 0 ? '#F5C6A0' : '#C68642', hair: idx === 0 ? '#5A3A1B' : '#1B1430' }; }
function pickFood() { return FOODS[Math.floor(Math.random() * FOODS.length)]; }
function startGame(mode) {
  G.mode = mode; G.screen = 'play'; G.shots = []; G.clock = TIME; G.anim = null; G.winner = -1;
  G.players = [mkPlayer(0, false), mkPlayer(1, mode === 'solo')];
  C.ui.hideAll();
  C.ui.toast(mode === 'solo' ? 'Du är nere. Kocken är uppe. Swipa upp för att kasta, sidled för att ducka.' : 'Spelare 1 nere (⇡ kastar), spelare 2 uppe (⇣ kastar). Sidled duckar.', 3000);
}
function move(p, d) { if (G.screen !== 'play' || G.anim) return; const nl = C.clamp(p.lane + d, 0, 2); if (nl === p.lane) return; p.lane = nl; C.haptics.tick(); C.audio.tone(400, 0.05, 'square', 0.03); }
function throwFood(p) {
  if (G.screen !== 'play' || G.anim || p.cool > 0) return;
  const f = p.ammo; p.ammo = p.next; p.next = pickFood(); p.cool = 0.7;
  const target = G.players[1 - p.idx];
  G.shots.push({ from: p.idx, food: f, x: p.x, y0: faceY(p), y1: faceY(target), t: 0, dur: f.speed, rot: 0 });
  C.haptics.light(); C.audio.whoosh(); p.expr = 0.3;
}
function arrive(s) {
  const target = G.players[1 - s.from], thrower = G.players[s.from];
  const dx = Math.abs(target.x - s.x), hit = dx < 46 || (s.food.wide && dx < 130);
  if (hit) {
    target.hits++; thrower.landed++; target.hitT = 0.8;
    const top = halfTop(target);
    target.splats.push({ x: 40 + Math.random() * (g.W - 80), y: top + 40 + Math.random() * (g.H / 2 - 80), r: s.food.size, color: s.food.color, t: 0, dur: s.food.splat, drips: Array.from({ length: 4 }, () => ({ dx: (Math.random() - 0.5) * s.food.size * 0.8, len: 20 + Math.random() * 40 })) });
    g.fx.text(target.x, faceY(target) + (target.idx === 0 ? -80 : 80), 'SPLAT!', '#FFF7EC', 34, 1);
    g.fx.burst(target.x, faceY(target), 16, [s.food.color.replace(/[\d.]+\)$/, '1)'), '#FFF7EC'], 260, 0.8);
    g.fx.shake = 14; C.haptics.big(); C.audio.splash();
    if (target.hits >= MAXHITS) { G.winner = s.from; G.anim = { t: 0, dur: 1.2, after: showOver }; C.haptics.win(); C.audio.fanfare(); }
  } else { g.fx.burst(s.x, s.y1 + (target.idx === 0 ? 60 : -60), 8, ['#B9B4CC'], 120, 0.5); C.audio.pop(); }
}
function updateAI(p, dt) {
  const me = G.players[0];
  p.aiT -= dt;
  const aggression = 1 + (TIME - G.clock) / TIME;
  // dodge incoming
  const incoming = G.shots.find(s => s.from === 0 && s.t / s.dur > 0.45 && Math.abs(s.x - p.x) < 60);
  if (incoming && p.aiMoveT <= 0 && Math.random() < 0.55 * aggression * dt * 6) { const d = p.lane === 0 ? 1 : p.lane === 2 ? -1 : (Math.random() < 0.5 ? -1 : 1); move(p, d); p.aiMoveT = 0.45; }
  if (p.aiMoveT > 0) p.aiMoveT -= dt;
  if (p.aiT <= 0) {
    p.aiT = (0.9 + Math.random() * 0.7) / aggression;
    if (p.lane !== me.lane && Math.random() < 0.7) { move(p, me.lane > p.lane ? 1 : -1); p.aiT = 0.35; }
    else throwFood(p);
  }
}
function update(dt) {
  if (G.screen !== 'play') return;
  for (const p of G.players) { p.x += (g.W / 2 + LANES[p.lane] - p.x) * Math.min(1, dt * 14); if (p.cool > 0) p.cool -= dt; if (p.hitT > 0) p.hitT -= dt; if (p.expr > 0) p.expr -= dt; for (const sp of p.splats) sp.t += dt; p.splats = p.splats.filter(sp => sp.t < sp.dur); }
  if (G.anim) { G.anim.t += dt; if (G.anim.t >= G.anim.dur) { const a = G.anim; G.anim = null; a.after(); } return; }
  G.clock -= dt; if (G.clock <= 0) { G.clock = 0; const [a, b] = G.players; G.winner = a.hits === b.hits ? -1 : a.hits < b.hits ? 0 : 1; G.anim = { t: 0, dur: 0.6, after: showOver }; return; }
  if (G.mode === 'solo') updateAI(G.players[1], dt);
  for (const s of G.shots) { s.t += dt; s.rot += dt * 10; if (s.t >= s.dur) { s.done = true; arrive(s); } }
  G.shots = G.shots.filter(s => !s.done);
}
function showOver() {
  G.screen = 'over'; G.overReadyAt = performance.now() + 500;
  const [a, b] = G.players;
  if (G.mode === 'solo') {
    const won = G.winner === 0, score = a.landed * 100 + (won ? Math.round(G.clock) * 10 : 0);
    const best = S.get('best', 0), rec = score > best; if (rec) S.set('best', score);
    C.ui.setText('overTag', won ? 'DU VANN MOT KOCKEN' : G.winner === -1 ? 'OAVGJORT' : 'KOCKEN VANN');
    C.ui.setText('overScore', a.landed + ' – ' + b.landed);
    C.ui.setText('overSub', score + ' p' + (rec ? ' · NYTT REKORD!' : ' · Bästa: ' + best) + (won && G.clock > 0 ? ' · ' + Math.round(G.clock) + ' s kvar' : ''));
    if (rec && best > 0) { C.haptics.win(); C.audio.fanfare(); }
    updateBest();
  } else {
    C.ui.setText('overTag', G.winner === -1 ? 'OAVGJORT' : 'SPELARE ' + (G.winner + 1) + ' VANN'); C.ui.setText('overScore', a.landed + ' – ' + b.landed); C.ui.setText('overSub', 'Träffar i ansiktet. Spelare 1 nere, spelare 2 uppe.');
  }
  C.ui.show('over');
}
function restart() { startGame(G.mode); }
function goMenu() { G.screen = 'menu'; C.ui.hideAll(); C.ui.show('menu'); updateBest(); }
function updateBest() { const b = S.get('best', 0); C.ui.setText('bestLine', b ? 'Bästa mot kocken: ' + b : 'Inget rekord mot kocken än'); }

function drawFace(ctx, p) {
  const x = p.x, y = faceY(p), R = 46, hit = p.hitT > 0;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = p.hair; ctx.beginPath(); ctx.arc(0, -8, R + 4, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = p.skin; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20,12,40,.5)'; ctx.stroke();
  ctx.fillStyle = p.hair; ctx.beginPath(); ctx.arc(0, -10, R, Math.PI * 1.15, Math.PI * 1.85); ctx.fill();
  if (p.ai) { ctx.fillStyle = '#FFF7EC'; C.rrect(ctx, -30, -R - 26, 60, 26, 6); ctx.fill(); ctx.beginPath(); ctx.arc(-16, -R - 26, 12, 0, Math.PI * 2); ctx.arc(16, -R - 26, 12, 0, Math.PI * 2); ctx.arc(0, -R - 32, 14, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#1B1430';
  if (hit) { ctx.lineWidth = 3; ctx.strokeStyle = '#1B1430'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 18 - 6, -12); ctx.lineTo(s * 18 + 6, 0); ctx.moveTo(s * 18 + 6, -12); ctx.lineTo(s * 18 - 6, 0); ctx.stroke(); } ctx.beginPath(); ctx.ellipse(0, 18, 10, 12, 0, 0, Math.PI * 2); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(-16, -6, 5, 0, Math.PI * 2); ctx.arc(16, -6, 5, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#1B1430'; ctx.beginPath(); if (p.expr > 0) { ctx.arc(0, 12, 12, 0, Math.PI); } else { ctx.arc(0, 14, 10, 0.15 * Math.PI, 0.85 * Math.PI); } ctx.stroke(); ctx.beginPath(); ctx.moveTo(-26, -24); ctx.lineTo(-8, -18); ctx.moveTo(26, -24); ctx.lineTo(8, -18); ctx.stroke(); }
  ctx.restore();
  // plate with ammo
  const py = p.idx === 0 ? y + 70 : y - 70;
  ctx.beginPath(); ctx.ellipse(x, py, 34, 12, 0, 0, Math.PI * 2); ctx.fillStyle = '#FFF7EC'; ctx.fill();
  if (p.cool <= 0) C.emoji(ctx, p.ammo.e, x, py - 8, 30); else { ctx.save(); ctx.globalAlpha = 0.4; C.emoji(ctx, p.ammo.e, x, py - 8, 30 * (1 - p.cool / 0.7)); ctx.restore(); }
  C.text(ctx, 'NÄSTA ' + p.next.e, x, p.idx === 0 ? py + 22 : py - 22, 11, '#B9B4CC', 'center', C.F.ui, false);
}
function render(ctx) {
  const W = g.W, H = g.H;
  ctx.save(); g.fx.applyShake(ctx);
  ctx.fillStyle = '#1E1B2E'; ctx.fillRect(0, 0, W, H);
  if (G.screen !== 'menu') {
    // cafeteria tiles
    ctx.fillStyle = '#26223A'; for (let y = 0; y < H; y += 40) for (let x = (y / 40) % 2 * 40; x < W; x += 80) ctx.fillRect(x, y, 40, 40);
    // table divider
    ctx.fillStyle = '#8B5A2B'; ctx.fillRect(0, H / 2 - 16, W, 32); ctx.fillStyle = '#A5713A'; ctx.fillRect(0, H / 2 - 16, W, 6);
    for (const p of G.players) { const y = faceY(p); ctx.fillStyle = 'rgba(0,0,0,.25)'; for (const l of LANES) { ctx.beginPath(); ctx.ellipse(W / 2 + l, y + (p.idx === 0 ? 50 : -50), 40, 8, 0, 0, Math.PI * 2); ctx.fill(); } }
    for (const p of G.players) drawFace(ctx, p);
    for (const s of G.shots) { const k = s.t / s.dur, y = C.lerp(s.y0, s.y1, k), arc = Math.sin(k * Math.PI) * 30; ctx.save(); ctx.translate(s.x, y - arc); ctx.rotate(s.rot); C.emoji(ctx, s.food.e, 0, 0, 34 + Math.sin(k * Math.PI) * 14); ctx.restore(); }
    // splats over the victim's half
    for (const p of G.players) for (const sp of p.splats) {
      const k = sp.t / sp.dur, a = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = sp.color; ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r * 0.5, 0, Math.PI * 2); ctx.fill();
      for (let n = 0; n < 5; n++) { const ang = n * 1.26 + sp.x * 0.01; ctx.beginPath(); ctx.arc(sp.x + Math.cos(ang) * sp.r * 0.42, sp.y + Math.sin(ang) * sp.r * 0.42, sp.r * (0.16 + (n % 2) * 0.08), 0, Math.PI * 2); ctx.fill(); }
      for (const d of sp.drips) { const len = d.len * Math.min(1, sp.t * 1.5); ctx.fillRect(sp.x + d.dx - 4, sp.y, 8, len); ctx.beginPath(); ctx.arc(sp.x + d.dx, sp.y + len, 5, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    // HUD
    for (const p of G.players) { const top = halfTop(p), col = p.idx === 0 ? '#FFC145' : '#9AD0F5'; const name = p.ai ? 'KOCKEN' : G.mode === 'solo' ? 'DU' : 'SPELARE ' + (p.idx + 1); const y = p.idx === 0 ? H - 24 : 26; C.text(ctx, name, 16, y, 16, col, 'left'); C.text(ctx, '💥'.repeat(p.hits) + '○'.repeat(Math.max(0, MAXHITS - p.hits)), W - 16, y, 16, '#FFF7EC', 'right'); C.text(ctx, 'TRÄFFAR ' + p.landed, W / 2, y, 12, '#B9B4CC', 'center', C.F.ui); }
    C.text(ctx, Math.ceil(G.clock) + ' s', W / 2, H / 2, 18, '#FFF7EC');
    if (G.anim && G.winner >= 0) C.text(ctx, (G.mode === 'solo' ? (G.winner === 0 ? 'DU VANN!' : 'KOCKEN VANN') : 'SPELARE ' + (G.winner + 1) + ' VANN'), W / 2, H / 2 + (G.winner === 0 ? 60 : -60), 40, '#FF5E5B');
    C.text(ctx, 'MENY', 16, H / 2 + 40, 12, 'rgba(255,247,236,.45)', 'left', C.F.ui, false);
  }
  g.fx.draw(ctx); ctx.restore();
}
function playerFor(s) { if (G.mode === 'solo') return G.players[0]; return s.sy < g.H / 2 ? G.players[1] : G.players[0]; }
function onTap(x, y, s) {
  if (G.screen === 'play') { if (x < 70 && Math.abs(y - (g.H / 2 + 40)) < 16) { goMenu(); return; } throwFood(playerFor(s)); }
  else if (G.screen === 'over' && performance.now() > G.overReadyAt) restart();
}
function onSwipe(dir, s) {
  if (G.screen !== 'play') return; const p = playerFor(s);
  if (dir === 'left') move(p, -1); else if (dir === 'right') move(p, 1);
  else if ((dir === 'up' && p.idx === 0) || (dir === 'down' && p.idx === 1)) throwFood(p);
}
const g = C.mount({ ariaLabel: 'Matkriget spelplan', onTap, onSwipe, update, render, onKey: k => {
  if (k === 'Escape') { goMenu(); return true; }
  if ((k === ' ' || k === 'Enter') && G.screen === 'menu') { startGame('solo'); return true; }
  if (G.screen === 'play' && G.mode === 'duel') { const p2 = G.players[1]; if (k === 'a') { move(p2, -1); return true; } if (k === 'd') { move(p2, 1); return true; } if (k === 's' || k === 'w') { throwFood(p2); return true; } }
  return false; } });
function refreshToggles() { C.ui.setText('bHap', 'Vibration: ' + (C.haptics.on ? 'på' : 'av')); C.ui.setText('bSnd', 'Ljud: ' + (C.audio.on ? 'på' : 'av')); }
C.ui.bind('bPlay', () => startGame('solo'));
C.ui.bind('bDuel', () => startGame('duel'));
C.ui.bind('bHap', () => { C.haptics.on = !C.haptics.on; S.set('haptics', C.haptics.on); refreshToggles(); C.haptics.medium(); });
C.ui.bind('bSnd', () => { C.audio.on = !C.audio.on; S.set('sound', C.audio.on); refreshToggles(); C.audio.blip(1); });
C.ui.bind('bAgain', restart); C.ui.bind('bMenu', goMenu);
C.ui.overlayTap('over', () => { if (performance.now() > G.overReadyAt) restart(); });
refreshToggles(); updateBest(); window.__G = G;
const boot = () => g.start();
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
</script>
</body>
</html>
