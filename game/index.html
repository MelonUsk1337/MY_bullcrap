<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hangry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
:root{
  --ground:#1B1430; --ground2:#33224F; --cream:#FFF4DF; --dim:#B9A9CC;
  --mustard:#FFC145; --mustard-dk:#B8811B; --ketchup:#FF4B3E; --ketchup-dk:#A8261C;
  --lettuce:#62D26F; --panel:rgba(22,15,40,.88); --card:#2A1E44; --card-dk:#251A3B; --line:#4A3A6A;
  --p1:#FFC145; --p2:#FF4B3E;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ground);color:var(--cream);font-family:Nunito,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ground)}
#box{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ground)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:24px;padding-inline:20px;background:var(--panel);text-align:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto}
.ov[hidden]{display:none}
.logo{font-family:"Lilita One",Impact,"Arial Black",system-ui,sans-serif;font-size:clamp(56px,17vw,76px);line-height:1;margin:0;color:var(--mustard);text-shadow:0 5px 0 #7A3E00,0 12px 28px rgba(0,0,0,.45);letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--dim);font-weight:700;margin:0;max-width:32ch;text-wrap:balance;line-height:1.35}
.btn{font:900 20px/1 Nunito,system-ui,sans-serif;border:0;border-radius:18px;padding:18px 28px;min-width:230px;color:#2A1600;background:var(--mustard);box-shadow:0 6px 0 var(--mustard-dk);cursor:pointer;transition:transform .05s,box-shadow .05s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mustard-dk)}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.btn.sec{background:var(--card);color:var(--cream);box-shadow:0 6px 0 var(--card-dk);font-size:15px;padding:13px 18px;min-width:0}
.btn.sec:active{box-shadow:0 2px 0 var(--card-dk)}
.btn.red{background:var(--ketchup);color:#fff;box-shadow:0 6px 0 var(--ketchup-dk)}
.btn.red:active{box-shadow:0 2px 0 var(--ketchup-dk)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px}
.how div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding-block:10px;padding-inline:6px;font-size:12px;font-weight:800;color:var(--dim);line-height:1.25}
.how b{display:block;font-size:26px;color:var(--cream);margin-bottom:4px;font-family:"Lilita One",Impact,system-ui,sans-serif;font-weight:400}
.big{font-family:"Lilita One",Impact,"Arial Black",system-ui,sans-serif;font-size:72px;line-height:1;margin:0;color:var(--cream);font-variant-numeric:tabular-nums}
.big.p1{color:var(--p1)}.big.p2{color:var(--p2)}
.tag{font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0}
.small{font-size:12px;color:var(--dim);margin:0;font-weight:700}
#toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--cream);color:var(--ground);padding-block:10px;padding-inline:14px;border-radius:12px;font-weight:800;font-size:14px;max-width:88%;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.show{opacity:1}
#linkbox{width:100%;max-width:320px;font:700 12px ui-monospace,Menlo,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:#120D22;color:var(--cream);-webkit-user-select:text;user-select:text}
#linkbox[hidden]{display:none}
#pad{position:absolute;inset:0;display:block;cursor:pointer}
.hx{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;margin:0}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div id="stage"><div id="box"><div id="frame">
<label id="pad" for="hxs"><canvas id="c" aria-label="Hangry spelplan"></canvas></label>
<input type="checkbox" switch id="hxs" class="hx" tabindex="-1" aria-hidden="true">

<div id="menu" class="ov">
  <h1 class="logo">HANGRY</h1>
  <p class="sub">Stapla burgaren upp till kundens mun. Släng skräpet. Rasar den är det game over.</p>
  <div class="how" aria-label="Så här spelar du">
    <div><b>TAP</b>släpp lagret</div>
    <div><b>⇠ ⇢</b>swipa bort skräp</div>
    <div><b>⇡</b>servera (från 3 lager)</div>
  </div>
  <button class="btn" id="bPlay">SPELA</button>
  <div class="row">
    <button class="btn sec" id="bDaily">Dagens utmaning</button>
    <button class="btn sec" id="bDuel">Duell · 2 spelare</button>
  </div>
  <div class="row">
    <button class="btn sec" id="bHap">Vibration: på</button>
    <button class="btn sec" id="bSnd">Ljud: på</button>
  </div>
  <p class="small" id="bestLine"></p>
  <p class="small" id="challengeLine" hidden></p>
</div>

<div id="over" class="ov" hidden>
  <p class="tag" id="overTag">GAME OVER</p>
  <p class="big" id="overScore">0</p>
  <p class="sub" id="overSub"></p>
  <button class="btn" id="bAgain">IGEN</button>
  <div class="row">
    <button class="btn sec" id="bShare">Utmana en vän</button>
    <button class="btn sec" id="bMenu">Meny</button>
  </div>
  <input id="linkbox" hidden readonly aria-label="Utmaningslänk">
  <p class="small">Tryck var som helst för att köra igen</p>
</div>

<div id="duelOver" class="ov" hidden>
  <p class="tag">RUNDAN ÄR SLUT</p>
  <p class="big" id="duelWinner">SPELARE 1</p>
  <p class="sub" id="duelSub"></p>
  <p class="tag" id="duelWins">0 – 0</p>
  <button class="btn" id="bNext">NÄSTA RUNDA</button>
  <button class="btn sec" id="bMenu2">Meny</button>
</div>

<div id="toast" role="status"></div>
</div></div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
const box = $('box'), frame = $('frame');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;

// ---------------------------------------------------------------- storage
const store = {
  get(k, d) { try { const v = localStorage.getItem('hangry.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hangry.' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------------------------------------------------------------- seeded rng
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rngAt = (seed, i) => mulberry32(xmur3(seed + ':' + i)());

// ---------------------------------------------------------------- config
const CFG = {
  W: 390,
  startW: 210,
  perfectTol: 8,
  nearTol: 20,
  regrow: 7,
  baseSpeed: 210, speedPerPiece: 9, maxSpeed: 640,
  targets: [6, 8, 10, 12, 14],
  junkBase: 0.07, junkPerPiece: 0.0045, junkMax: 0.26, junkFrom: 3,
  goldP: 0.05,
  swipePx: 22,
  minServe: 3,
};
const FOODS = [
  { c: '#7B4A2D', e: '🥩' }, { c: '#FFD23F', e: '🧀' }, { c: '#62D26F', e: '🥬' }, { c: '#FF4B3E', e: '🍅' },
  { c: '#C8553D', e: '🥓' }, { c: '#EBD9F5', e: '🧅' }, { c: '#7BAE3F', e: '🥒' }, { c: '#FFF1C1', e: '🍳' },
];
const BUN = { c: '#E0A458', e: '🍞' };
const GOLD = { c: '#FFD700', e: '⭐' };
const JUNK = { c: '#5B6072' };
const JUNKS = ['🧦', '👟', '🐟', '💣', '🪨', '🧽', '🪥', '🧱', '🐛', '🎱'];
const SKINS = ['#F5C6A0', '#C68642', '#8D5524', '#FFDBAC', '#E0AC69', '#B5E7A0', '#9AD0F5', '#F5A3C7', '#D9C2FF'];
const SAY = {
  intro: ['JAG ÄR HANGRY!', 'MAT. NU.', 'SNABBA PÅ!', 'JAG SVIMMAR SNART'],
  perfect: ['PERFEKT!', 'MMM', 'MER!', 'SNYGGT'],
  chomp: ['CHOMP!', 'NOM NOM NOM', 'GAAAH SÅ GOTT', 'MER!!!'],
  serve: ['HMPF. LITEN.', 'OKEJ DÅ…', 'JAG VILLE HA MER!'],
  junkOut: ['PUH!', 'ÄSCH!', 'TACK!', 'NÄRA ÖGAT'],
  junkIn: ['BLÄÄÄ!!!', 'EN STRUMPA?!', 'JAG SPYR'],
  foodOut: ['HEJ! MIN MAT!', 'SLÖSERI!', 'DEN VILLE JAG HA'],
  miss: ['NEEEJ!', 'MIN BURGARE!', 'KATASTROF!'],
};
const F_DISPLAY = '"Lilita One", Impact, "Arial Black", system-ui, sans-serif';
const F_UI = 'Nunito, system-ui, -apple-system, sans-serif';
const F_EMOJI = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';

// ---------------------------------------------------------------- haptics
const haptics = {
  on: store.get('haptics', true),
  canVibrate: typeof navigator.vibrate === 'function',
  iosLabel: null,
  init() {
    if (this.canVibrate) return;
    // iOS Safari has no Vibration API. A native switch checkbox (iOS 17.4+) plays the
    // system haptic tick when toggled. The canvas sits inside a <label for="hxs">, so
    // every real tap/swipe toggles it (works on all iOS versions incl. 26.5+). Script-
    // triggered label.click() adds event-timed ticks on iOS 17.4–26.4 only.
    this.iosLabel = $('pad');
  },
  pulse(pattern) {
    if (!this.on) return;
    if (this.canVibrate) { try { navigator.vibrate(pattern); } catch (e) {} return; }
    if (!this.iosLabel) return;
    const arr = Array.isArray(pattern) ? pattern : [pattern];
    let t = 0;
    for (let k = 0; k < arr.length; k += 2) {
      if (k === 0) { try { this.iosLabel.click(); } catch (e) {} }
      else { const at = t; setTimeout(() => { try { this.iosLabel.click(); } catch (e) {} }, at); }
      t += arr[k] + (arr[k + 1] || 0);
    }
  },
  tap() { if (this.canVibrate) this.pulse(10); },
  light() { this.pulse(18); },
  medium() { this.pulse(35); },
  perfect(combo) { this.pulse(combo >= 5 ? [20, 30, 20, 30, 20, 30, 60] : combo >= 2 ? [25, 40, 45] : [40]); },
  chomp() { this.pulse([70, 50, 70, 50, 140]); },
  fail() { this.pulse([140, 70, 220]); },
  win() { this.pulse([40, 40, 40, 40, 40, 40, 160]); },
};

// ---------------------------------------------------------------- audio (synth, no assets)
const audio = {
  on: store.get('sound', true), ctx: null,
  unlock() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  tone(f, dur, type = 'sine', gain = 0.15, slide = 0, delay = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, gain = 0.2, freq = 800, delay = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.7;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(this.ctx.destination); s.start(t);
  },
  drop() { this.tone(150, 0.09, 'triangle', 0.25, -70); this.noise(0.06, 0.15, 500); },
  perfect(combo) {
    const base = 440 * Math.pow(1.05946, Math.min(combo, 14) * 2);
    this.tone(base, 0.12, 'square', 0.06); this.tone(base * 1.5, 0.2, 'sine', 0.12);
    if (combo >= 5) this.tone(base * 2, 0.25, 'sine', 0.08, 0, 0.06);
  },
  fling() { this.noise(0.18, 0.18, 1600); this.tone(500, 0.16, 'sine', 0.05, 700); },
  gold() { [0, 0.07, 0.14].forEach((d, i) => this.tone(880 * Math.pow(1.25, i), 0.16, 'triangle', 0.12, 0, d)); },
  chomp() { this.tone(200, 0.25, 'sawtooth', 0.18, -150); this.noise(0.2, 0.25, 300); this.tone(170, 0.25, 'sawtooth', 0.18, -120, 0.18); this.noise(0.2, 0.25, 300, 0.18); },
  fail() { this.tone(320, 0.55, 'sawtooth', 0.14, -260); this.noise(0.3, 0.2, 200); },
  serve() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.14, 'sine', 0.11, 0, i * 0.09)); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.12, 0, i * 0.1)); },
};

// ---------------------------------------------------------------- state
let W = 390, H = 780, cssScale = 1, plateY = 660, layerH = 30;
const G = {
  screen: 'menu', mode: 'free', seed: '', pieceIndex: 0,
  stack: [], piece: null, fx: [], parts: [], texts: [],
  score: 0, combo: 0, bestCombo: 0, customer: 1, chomps: 0, target: 6,
  face: null, bubble: null, anim: null, shake: 0, t: 0, glow: 0,
  turn: 0, wins: [0, 0], overReadyAt: 0, firstJunkSeen: false, showTapHint: true,
  challengeSeed: null, challengeScore: 0,
};
const topY = () => plateY - G.stack.length * layerH;
const mouthY = () => plateY - G.target * layerH;
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const junkP = i => i < CFG.junkFrom ? 0 : clamp(CFG.junkBase + CFG.junkPerPiece * i, 0, CFG.junkMax);
const newFace = () => ({ skin: SKINS[(G.customer - 1) % SKINS.length], sick: false, blink: 0, brow: Math.random() * 0.4 });

// ---------------------------------------------------------------- layout
function resize() {
  const bw = box.clientWidth || window.innerWidth, bh = box.clientHeight || window.innerHeight;
  let cw = bw, ch = bh;
  if (bh / bw < 1.45) cw = Math.floor(bh / 1.45);
  else if (bh / bw > 2.4) ch = Math.floor(bw * 2.4);
  frame.style.width = cw + 'px'; frame.style.height = ch + 'px';
  W = CFG.W; H = Math.round(CFG.W * ch / cw);
  cssScale = cw / W;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  plateY = H - 118;
  layerH = clamp(Math.floor((plateY - 175) / 14), 20, 30);
}

// ---------------------------------------------------------------- effects
function addText(x, y, text, color, size = 22, life = 0.9) { G.texts.push({ x, y, text, color, size, life, dur: life }); }
function burst(x, y, n, colors, spd = 260, life = 0.6, grav = 700) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life, dur: life, size: 3 + Math.random() * 5, color: pick(colors), grav, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12 });
  }
}
function ring(x, y, color) { G.parts.push({ ring: true, x, y, r: 10, vr: 420, life: 0.35, dur: 0.35, color }); }
function say(text, secs = 1.4) { G.bubble = { text, until: G.t + secs, born: G.t }; }
let toastTimer = 0;
function toast(msg, ms = 1600) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms); }

// ---------------------------------------------------------------- game flow
function startGame(mode) {
  G.mode = mode; G.screen = 'play';
  if (mode === 'daily') G.seed = 'daily-' + todayStr();
  else if (mode === 'challenge') G.seed = G.challengeSeed;
  else G.seed = Math.random().toString(36).slice(2, 8);
  G.pieceIndex = 0; G.stack = []; G.fx = []; G.parts = []; G.texts = [];
  G.score = 0; G.combo = 0; G.bestCombo = 0; G.customer = 1; G.chomps = 0; G.target = CFG.targets[0];
  G.anim = null; G.shake = 0; G.glow = 0; G.turn = 0; G.firstJunkSeen = false; G.piece = null;
  G.showTapHint = !store.get('played', false);
  G.face = newFace();
  hideOverlays();
  say(pick(SAY.intro) + ' ' + G.target + ' LAGER!', 2.4);
  spawnPiece();
}
function spawnPiece() {
  const i = G.pieceIndex++;
  const r = rngAt(G.seed, i), a = r(), b = r(), c = r(), d = r(), e = r();
  const n = G.stack.length;
  let junk = a < junkP(i) && !(rngAt(G.seed, i - 1)() < junkP(i - 1));
  let gold = !junk && b < CFG.goldP;
  let type = FOODS[Math.floor(c * FOODS.length)];
  if (n === 0 || n === G.target - 1) { junk = false; gold = false; type = BUN; }
  const top = G.stack[n - 1];
  const w = top ? top.w : CFG.startW;
  const teach = junk && !G.firstJunkSeen;
  const speed = Math.min(CFG.maxSpeed, CFG.baseSpeed + CFG.speedPerPiece * i) * (teach ? 0.6 : 1);
  const dir = d < 0.5 ? 1 : -1;
  G.piece = {
    kind: junk ? 'junk' : gold ? 'gold' : 'food',
    x: dir > 0 ? 8 : W - 8 - w, w, y: topY() - 120, dir, speed, state: 'swing',
    color: junk ? JUNK.c : gold ? GOLD.c : type.c,
    emoji: junk ? JUNKS[Math.floor(e * JUNKS.length)] : gold ? GOLD.e : type.e,
    rot: 0, vx: 0, vy: 0, vr: 0, born: G.t, owner: G.turn,
  };
  if (teach) { G.firstJunkSeen = true; say('SKRÄP! SWIPA BORT ⇠ ⇢', 2.6); }
}
function dropPiece(slam) {
  const p = G.piece; if (!p || p.state !== 'swing') return;
  p.state = 'fall'; p.vy = slam ? 1500 : 380; p.slam = !!slam;
  haptics.tap();
  if (G.showTapHint) { G.showTapHint = false; store.set('played', true); }
}
function land(p) {
  audio.drop();
  const n = G.stack.length;
  if (p.kind === 'junk') { die('junk', p); return; }
  const ref = n ? G.stack[n - 1] : { x: (W - CFG.startW) / 2, w: CFG.startW };
  const off = p.x - ref.x;
  const left = Math.max(p.x, ref.x), right = Math.min(p.x + p.w, ref.x + ref.w), overlap = right - left;
  const cx = p.x + p.w / 2, ly = topY() - layerH;
  if (Math.abs(off) <= CFG.perfectTol) {
    G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo);
    let w = ref.w, x = ref.x;
    const nw = Math.min(CFG.startW, w + CFG.regrow); x -= (nw - w) / 2; w = nw;
    let pts = 10 + 10 * G.combo;
    if (p.kind === 'gold') { pts *= 5; audio.gold(); addText(cx, ly - 46, 'GULD! +' + pts, '#FFD700', 30, 1.2); burst(cx, ly, 30, ['#FFD700', '#FFF4DF', '#FFC145'], 320, 0.9); }
    else addText(cx, ly - 40, (G.combo >= 2 ? 'x' + G.combo + ' ' : '') + 'PERFEKT! +' + pts, '#FFC145', 24 + Math.min(G.combo, 6) * 2, 0.9);
    if (p.slam) { pts += 10; addText(cx, ly - 70, 'SLAM +10', '#FFF4DF', 18, 0.8); }
    G.score += pts; G.glow = Math.min(1, G.combo * 0.18);
    ring(cx, ly, G.combo >= 5 ? '#FF4B3E' : '#FFC145');
    burst(cx, ly, 8 + G.combo * 2, ['#FFC145', '#FFF4DF'], 180, 0.5, 300);

// ---------------------------------------------------------------- update
function update(dt) {
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);
  if (G.glow > 0) G.glow = Math.max(0, G.glow - dt * 0.4);
  if (G.face) { G.face.blink = Math.max(0, G.face.blink - dt); if (Math.random() < dt * 0.25) G.face.blink = 0.14; }
  const p = G.piece;
  if (p && G.screen === 'play' && !G.anim) {
    if (p.state === 'swing') {
      p.x += p.dir * p.speed * dt;
      const minX = 8, maxX = W - 8 - p.w;
      if (p.x < minX) { p.x = minX; p.dir = 1; } else if (p.x > maxX) { p.x = maxX; p.dir = -1; }
      p.y = topY() - 120 + Math.sin(G.t * 4) * 2;
    } else if (p.state === 'fall') {
      p.vy += 3400 * dt; p.y += p.vy * dt;
      const ly = topY() - layerH;
      if (p.y >= ly) { p.y = ly; land(p); }
    }
  }
  if (G.anim) { G.anim.t += dt; if (G.anim.t >= G.anim.dur) { const a = G.anim; G.anim = null; a.after(); } }
  for (const f of G.fx) {
    if (f.state === 'splat') continue;
    f.vy += 1500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
  }
  G.fx = G.fx.filter(f => f.state === 'splat' || (f.y < H + 200 && f.x > -400 && f.x < W + 400));
  for (const q of G.parts) {
    q.life -= dt;
    if (q.ring) { q.r += q.vr * dt; continue; }
    q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
  }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const tx of G.texts) { tx.life -= dt; tx.y -= 40 * dt; }
  G.texts = G.texts.filter(tx => tx.life > 0);
}

  else if (dir === 'down') dropPiece(true);
  else if (dir === 'up') {
    if (G.mode === 'duel') toast('Ingen servering i duell – bara stapla!');
    else if (G.stack.length >= CFG.minServe) serveEarly();
    else toast('Minst ' + CFG.minServe + ' lager innan du kan servera');
  }
}
canvas.addEventListener('pointerdown', e => {
  ptr.down = true; ptr.swiped = false; ptr.sx = e.clientX; ptr.sy = e.clientY; ptr.id = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  audio.unlock();
});
canvas.addEventListener('pointermove', e => {
  if (!ptr.down || ptr.swiped || e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy;
  if (Math.hypot(dx, dy) >= CFG.swipePx) {
    ptr.swiped = true;
    onSwipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }
});
function endPointer(e) {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.down = false;
  if (!ptr.swiped) {
    const r = canvas.getBoundingClientRect();
    onTap((e.clientX - r.left) / cssScale, (e.clientY - r.top) / cssScale);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e => { ptr.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (G.screen === 'play') onTap(W / 2, H / 2); else if (G.screen === 'over' && performance.now() > G.overReadyAt) restart(); else if (G.screen === 'duelover') restart(); else if (G.screen === 'menu') startGame(G.challengeSeed ? 'challenge' : 'free'); }
  else if (k === 'ArrowLeft') onSwipe('left'); else if (k === 'ArrowRight') onSwipe('right');
  else if (k === 'ArrowUp') onSwipe('up'); else if (k === 'ArrowDown') onSwipe('down');
  else if (k === 'Escape') goMenu();
});
$('over').addEventListener('pointerdown', e => {
  if (e.target.closest('button') || e.target.closest('input')) return;
  if (performance.now() > G.overReadyAt) restart();
});
function restart() { startGame(G.mode); }

// ---------------------------------------------------------------- menu wiring
function share() {
  const base = location.href.split('#')[0];
  const url = base + '#s=' + encodeURIComponent(G.seed) + '&t=' + G.score;
  const msg = 'HANGRY 🍔 Jag fick ' + G.score + ' p (' + (G.customer - 1) + ' kunder mättade). Samma burgare, slå mig: ' + url;
  const showBox = () => { const b = $('linkbox'); b.hidden = false; b.value = url; try { b.focus(); b.select(); } catch (e) {} toast('Kopiera länken och skicka till en vän'); };
  if (navigator.share) { navigator.share({ text: msg }).catch(() => copyOr(showBox)); }
  else copyOr(showBox);
  function copyOr(fallback) {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(() => toast('Utmaning kopierad! Klistra in i en chatt.'), fallback);
    else fallback();
  }
}
function refreshToggles() {
  $('bHap').textContent = 'Vibration: ' + (haptics.on ? 'på' : 'av');
  $('bSnd').textContent = 'Ljud: ' + (audio.on ? 'på' : 'av');
}
function parseHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (h.get('s')) {
    G.challengeSeed = h.get('s'); G.challengeScore = parseInt(h.get('t') || '0', 10) || 0;
    const line = $('challengeLine'); line.hidden = false;
    line.textContent = 'Utmaning från en vän: slå ' + G.challengeScore + ' p på exakt samma burgare. SPELA startar utmaningen.';
    $('bPlay').textContent = 'TA UTMANINGEN';
  }
}
function init() {
  haptics.init();
  resize(); window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  parseHash(); refreshToggles(); updateBestLine();
  $('bPlay').addEventListener('click', () => { audio.unlock(); haptics.tap(); startGame(G.challengeSeed ? 'challenge' : 'free'); });
  $('bDaily').addEventListener('click', () => { audio.unlock(); haptics.tap(); startGame('daily'); });
  $('bDuel').addEventListener('click', () => { audio.unlock(); haptics.tap(); G.wins = [0, 0]; startGame('duel'); toast('Turas om att släppa. Den som får burgaren att rasa förlorar.', 2600); });
  $('bHap').addEventListener('click', () => { haptics.on = !haptics.on; store.set('haptics', haptics.on); refreshToggles(); haptics.medium(); });
  $('bSnd').addEventListener('click', () => { audio.on = !audio.on; store.set('sound', audio.on); refreshToggles(); audio.unlock(); audio.perfect(1); });
  $('bAgain').addEventListener('click', () => { haptics.tap(); restart(); });
  $('bNext').addEventListener('click', () => { haptics.tap(); restart(); });
  $('bShare').addEventListener('click', share);
  $('bMenu').addEventListener('click', goMenu);
  $('bMenu2').addEventListener('click', goMenu);
  if (document.fonts && document.fonts.load) { document.fonts.load('20px "Lilita One"').catch(() => {}); }
  let last = performance.now();
  const loop = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
const boot = () => init();
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
</script>
</body>
