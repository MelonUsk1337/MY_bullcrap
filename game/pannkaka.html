<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pannkakstornet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
:root{--ground:#3B2417;--panel:rgba(40,22,12,.9);--cream:#FFF6E3;--dim:#D2B48C;--accent:#F2B84B;--accent-shadow:#9C6A12;--btn-text:#2B1600;--card:#5A3A25;--card-dk:#3B2417;--line:#7A5238;--how-cols:3;color-scheme:dark}
</style>
<script src="lib/core.js"></script>
</head>
<body>
<div id="stage"><div id="box"><div id="frame">
<div id="menu" class="ov">
  <h1 class="logo">PANNKAKS­TORNET</h1>
  <p class="sub">Vänd när markören är i guld. Skjut på stapeln när andra sidan är i guld. Tornet lutar för varje slarvig kaka. Sirap när du når munnen.</p>
  <div class="how" aria-label="Så här spelar du">
    <div><b>⇡</b>vänd i guld</div>
    <div><b>TAP</b>skjut på stapeln i guld</div>
    <div><b>⇠ ⇢</b>schasa flugan</div>
  </div>
  <button class="btn" id="bPlay">STEK</button>
  <div class="row">
    <button class="btn sec" id="bDaily">Dagens smet</button>
    <button class="btn sec" id="bDuel">Duell · 2 spelare</button>
  </div>
  <div class="row">
    <button class="btn sec" id="bHap">Vibration: på</button>
    <button class="btn sec" id="bSnd">Ljud: på</button>
  </div>
  <p class="small" id="bestLine"></p>
  <p class="small" id="challengeLine" hidden></p>
</div>
<div id="over" class="ov" hidden>
  <p class="tag" id="overTag">TORNET RASADE</p>
  <p class="big" id="overScore">0</p>
  <p class="sub" id="overSub"></p>
  <button class="btn" id="bAgain">IGEN</button>
  <div class="row">
    <button class="btn sec" id="bShare">Utmana en vän</button>
    <button class="btn sec" id="bMenu">Meny</button>
  </div>
  <input id="linkbox" class="linkbox" hidden readonly aria-label="Utmaningslänk">
  <p class="small">Tryck var som helst för att köra igen</p>
</div>
<div id="toast" role="status"></div>
</div></div></div>
<script>
(() => {
'use strict';
const C = Core, $ = C.$;
const S = C.store('pannkaka');
C.haptics.on = S.get('haptics', true); C.audio.on = S.get('sound', true);
const SKINS = ['#F5C6A0', '#C68642', '#8D5524', '#FFDBAC', '#E0AC69', '#B5E7A0', '#9AD0F5', '#F5A3C7'];
const SAY = { intro: ['PANNKAKOR. NU.', 'JAG ÄR HANGRY!', 'HÖGRE!', 'SIRAP SEN?'], perfect: ['FLUFFIGT!', 'MMM', 'MER!'], chomp: ['SIRAP!!!', 'NOM NOM', 'GAAAH'], burnt: ['BRÄND?!', 'KOL. NEJ.'], raw: ['RÅ SMET?!', 'BLÄ'], fly: ['EN FLUGA!!!', 'BLÄÄÄ'], topple: ['NEEEJ!', 'MINA KAKOR!'] };
const GOLD = { lo: 0.45, hi: 0.72, plo: 0.52, phi: 0.64 }, BURN = 0.86;
const PAN = { x: 96, r: 64 };
const STACK_X = 262, PANCAKE_R = 66, TOPPLE = 62;
const G = { screen: 'menu', mode: 'free', seed: '', stack: [], cake: null, i: 0, score: 0, best: 0, combo: 0, lives: 3, customer: 1, chomps: 0, targetH: 0, face: null, bubble: null, anim: null, fly: null, flyAt: 4, overReadyAt: 0, duel: { turn: 0, wins: [0, 0], responsible: 0 }, challengeSeed: null, challengeScore: 0, syrup: [], hint: true, offset: 0, wobble: 0 };
const plateY = () => g.H - 84, panY = () => g.H - 92;
const stackH = () => G.stack.reduce((a, p) => a + p.t, 0);
const topY = () => plateY() - stackH();
const mouthY = () => plateY() - G.targetH;
const cookTime = () => Math.max(1.5, 3.2 - 0.08 * G.i);
const newFace = () => ({ skin: SKINS[(G.customer - 1) % SKINS.length], blink: 0, sick: 0 });
function say(text, secs = 1.4) { G.bubble = { text, until: g.t + secs, born: g.t }; }

function startGame(mode) {
  G.mode = mode; G.screen = 'play';
  G.seed = mode === 'daily' ? 'daily-' + C.todayStr() : mode === 'challenge' ? G.challengeSeed : C.newSeed();
  G.stack = []; G.i = 0; G.score = 0; G.combo = 0; G.lives = 3; G.customer = 1; G.chomps = 0; G.targetH = 8 * 18; G.face = newFace(); G.anim = null; G.fly = null; G.flyAt = 4; G.syrup = []; G.offset = 0; G.wobble = 0; G.hint = !S.get('played', false);
  if (mode === 'duel') { G.duel.turn = 0; G.duel.responsible = 0; }
  C.ui.hideAll(); newCake(); say(C.pick(SAY.intro), 2.2);
  C.ui.toast(mode === 'duel' ? 'Turas om. Bränd kaka eller rasat torn = förlust.' : 'Swipa upp när markören är i guld.', 2400);
}
function newCake() { G.cake = { side: 1, d: 0, state: 'cook', q1: 0, owner: G.mode === 'duel' ? G.duel.turn : 0 }; }
function quality(d) { return d < GOLD.lo ? 'raw' : d <= GOLD.hi ? (d >= GOLD.plo && d <= GOLD.phi ? 'perfect' : 'good') : 'late'; }
function flip() {
  const c = G.cake; if (!c || c.state !== 'cook' || c.side !== 1 || G.anim) return;
  const q = quality(c.d); c.q1 = q; c.state = 'flip'; c.ft = 0; c.d1 = c.d;
  C.haptics.medium(); C.audio.whoosh();
  const x = PAN.x, y = panY() - 60;
  if (q === 'perfect') { g.fx.text(x, y, 'PERFEKT VÄNDNING!', '#F2B84B', 22); g.fx.ring(x, panY(), '#F2B84B'); C.audio.blip(3); }
  else if (q === 'good') g.fx.text(x, y, 'BRA', '#FFF6E3', 20);
  else if (q === 'raw') { g.fx.text(x, y, 'RÅ! SMETEN RINNER', '#9AD0F5', 18); say(C.pick(SAY.raw), 1); }
  else { g.fx.text(x, y, 'LITE BRÄND', '#8A5A1B', 18); }
  if (G.hint) { G.hint = false; S.set('played', true); C.ui.toast('Tryck när andra sidan är i guld – kakan flyger till stapeln.', 2400); }
}
function serve() {
  const c = G.cake; if (!c || c.state !== 'cook' || c.side !== 2 || G.anim) return;
  const q2 = quality(c.d), q1 = c.q1;
  const err = C.clamp((c.d - (GOLD.plo + GOLD.phi) / 2) / 0.14, -1.6, 1.6);
  let off = Math.round(err * 34); if (q2 === 'perfect') off = 0;
  const perf = (q1 === 'perfect') + (q2 === 'perfect');
  const bad = (q1 === 'raw' || q1 === 'late' || q2 === 'raw' || q2 === 'late');
  const t = perf === 2 ? 20 : perf === 1 ? 16 : bad ? 9 : 13;
  const color = q2 === 'late' || q1 === 'late' ? '#8A5A1B' : q2 === 'raw' || q1 === 'raw' ? '#F7E3B5' : perf ? '#E0A241' : '#D9993C';
  c.state = 'fly'; c.ft = 0; c.off = off; c.t = t; c.color = color; c.perf = perf; c.bad = bad;
  C.haptics.tap(); C.audio.pop();
}
function land(c) {
  G.offset += c.off + (c.bad ? (c.off >= 0 ? 12 : -12) : 0);
  if (c.perf === 2) G.offset = Math.round(G.offset * 0.5);
  G.stack.push({ t: c.t, color: c.color, x: G.offset, perf: c.perf, born: g.t, butter: c.perf === 2, fly: false });
  let pts = c.bad ? 5 : 10 + 5 * c.perf;
  if (c.perf === 2) { G.combo++; pts += 10 * Math.min(G.combo, 8); g.fx.text(STACK_X + G.offset, topY() - 40, (G.combo >= 2 ? 'x' + G.combo + ' ' : '') + 'FLUFFIG! +' + pts, '#F2B84B', 24 + Math.min(G.combo, 6) * 2); g.fx.ring(STACK_X + G.offset, topY(), '#F2B84B'); C.haptics.success(G.combo); C.audio.blip(G.combo); if (G.combo >= 3) say(C.pick(SAY.perfect), 0.8); }
  else { G.combo = 0; g.fx.text(STACK_X + G.offset, topY() - 40, '+' + pts, '#FFF6E3', 18, 0.7); C.haptics.light(); C.audio.thud(); }
  G.score += pts; G.wobble = 1; g.fx.burst(STACK_X + G.offset, topY(), 6, [c.color, '#FFF6E3'], 120, 0.4, 300);
  G.i++;
  if (Math.abs(G.offset) > TOPPLE) { topple(); return; }
  if (stackH() >= G.targetH) { chomp(); return; }
  if (G.mode === 'duel') { G.duel.responsible = G.duel.turn; G.duel.turn ^= 1; }
  newCake();
  if (G.i >= G.flyAt && !G.fly) { G.flyAt += 5 + Math.floor(C.rngAt(G.seed, G.i)() * 3); G.fly = { t: 0, state: 'buzz', x: g.W - 30, y: 140 }; }
}
function burnt() {
  const c = G.cake; G.lives--; G.combo = 0; c.state = 'burnt'; c.ft = 0;
  g.fx.text(PAN.x, panY() - 70, 'BRÄNT!', '#FF6B6B', 30, 1.2); g.fx.burst(PAN.x, panY() - 20, 16, ['#3B2612', '#666'], 180, 0.9, -100); g.fx.shake = 10;
  say(C.pick(SAY.burnt), 1.4); C.haptics.fail(); C.audio.buzz();
  if (G.lives <= 0) { G.anim = { t: 0, dur: 0.8, after: () => showOver('burnt') }; return; }
  G.anim = { t: 0, dur: 0.6, after: () => { if (G.mode === 'duel') { G.duel.responsible = G.duel.turn; G.duel.turn ^= 1; } newCake(); } };
}
function topple() {
  say(C.pick(SAY.topple), 3); g.fx.shake = 22; C.haptics.fail(); C.audio.crunch();
  G.anim = { t: 0, dur: 1.0, after: () => showOver('topple') }; G.cake = null; G.toppleDir = G.offset > 0 ? 1 : -1;
}
function chomp() {
  const n = G.stack.length, pts = 50 * n; G.score += pts; G.chomps++;
  say(C.pick(SAY.chomp), 1.4); g.fx.text(STACK_X, mouthY() - 60, 'SIRAP! +' + pts, '#F2B84B', 34, 1.6); g.fx.burst(STACK_X, mouthY(), 40, ['#F2B84B', '#FFF6E3', '#C8873E'], 380, 1.1);
  for (let k = 0; k < 14; k++) G.syrup.push({ x: STACK_X + G.offset + (Math.random() - 0.5) * 100, y: topY() - 10, v: 60 + Math.random() * 80, t: 0 });
  C.haptics.big(); C.audio.crunch(); G.cake = null;
  G.anim = { t: 0, dur: 1.1, after: () => { G.customer++; G.stack = []; G.offset = 0; G.syrup = []; G.targetH = Math.min(24, 8 + 4 * G.chomps) * 18; G.face = newFace(); say(C.pick(SAY.intro), 2); newCake(); } };
}
function shoo(sgn) {
  if (!G.fly || G.fly.state !== 'landed') return;
  G.score += 5; g.fx.text(G.fly.x, G.fly.y - 24, 'SCHAS! +5', '#FFF6E3', 18); G.fly.state = 'flee'; G.fly.vx = sgn * 500; G.fly.t = 0; C.haptics.light(); C.audio.whoosh();
}
function showOver(reason) {
  G.screen = 'over'; G.overReadyAt = performance.now() + 500;
  if (G.mode === 'duel') {
    const loser = G.duel.responsible, winner = 1 - loser; G.duel.wins[winner]++;
    C.ui.setText('overTag', 'SPELARE ' + (winner + 1) + ' VANN'); C.ui.setText('overScore', G.duel.wins[0] + ' – ' + G.duel.wins[1]);
    C.ui.setText('overSub', 'Spelare ' + (loser + 1) + (reason === 'topple' ? ' fick tornet att rasa' : ' brände för många kakor') + ' vid ' + G.stack.length + ' pannkakor.'); $('bShare').hidden = true; $('bAgain').textContent = 'NÄSTA RUNDA';
    C.haptics.win(); C.audio.fanfare();
  } else {
    const key = G.mode === 'daily' ? 'daily.' + C.todayStr() : 'best';
    const best = S.get(key, 0), rec = G.score > best; if (rec) S.set(key, G.score);
    C.ui.setText('overTag', (G.mode === 'daily' ? 'DAGENS SMET · ' : G.mode === 'challenge' ? 'UTMANING · ' : '') + (reason === 'topple' ? 'TORNET RASADE' : 'KÖKET BRANN'));
    C.ui.setText('overScore', String(G.score));
    let sub = (rec ? 'NYTT REKORD!' : 'Bästa: ' + best) + ' · ' + G.i + ' pannkakor · ' + (G.customer - 1) + ' kunder mättade';
    if (G.mode === 'challenge') sub += G.score > G.challengeScore ? ' · Du slog din vän (' + G.challengeScore + ')! 🏆' : ' · Din vän hade ' + G.challengeScore + '.';
    C.ui.setText('overSub', sub); $('bShare').hidden = false; $('bAgain').textContent = 'IGEN';
    if (rec && best > 0) { C.haptics.win(); C.audio.fanfare(); }
    updateBest();
  }
  $('linkbox').hidden = true; C.ui.show('over');
}
function restart() { startGame(G.mode); }
function goMenu() { G.screen = 'menu'; C.ui.hideAll(); C.ui.show('menu'); updateBest(); }
function updateBest() { const b = S.get('best', 0), d = S.get('daily.' + C.todayStr(), 0); C.ui.setText('bestLine', (b ? 'Bästa: ' + b : 'Inget rekord än') + (d ? ' · Dagens: ' + d : '')); }
function share() { const url = location.href.split('#')[0] + '#s=' + encodeURIComponent(G.seed) + '&t=' + G.score; C.share({ text: 'PANNKAKSTORNET 🥞 ' + G.score + ' p. Samma smet, slå mig:', url, linkboxId: 'linkbox' }); }

function update(dt) {
  if (G.screen !== 'play') return;
  if (G.face) { G.face.blink = Math.max(0, G.face.blink - dt); if (Math.random() < dt * 0.25) G.face.blink = 0.14; }
  if (G.wobble > 0) G.wobble = Math.max(0, G.wobble - dt * 1.5);
  for (const s of G.syrup) { s.t += dt; s.y += s.v * dt; }
  if (G.anim) { G.anim.t += dt; if (G.anim.t >= G.anim.dur) { const a = G.anim; G.anim = null; a.after(); } return; }
  const c = G.cake;
  if (c) {
    if (c.state === 'cook') { c.d += dt / cookTime(); if (c.d >= 1) burnt(); }
    else if (c.state === 'flip') { c.ft += dt / 0.42; if (c.ft >= 1) { c.state = 'cook'; c.side = 2; c.d = c.q1 === 'raw' ? 0.1 : 0; } }
    else if (c.state === 'fly') { c.ft += dt / 0.38; if (c.ft >= 1) { const cc = c; G.cake = null; land(cc); } }
  }
  if (G.fly) {
    const f = G.fly; f.t += dt;
    if (f.state === 'buzz') { const tx = STACK_X + G.offset, ty = topY() - 26; f.x += (tx - f.x) * dt * 1.6 + Math.sin(g.t * 20) * 2; f.y += (ty - f.y) * dt * 1.6 + Math.cos(g.t * 17) * 2; if (f.t > 1.6) { f.state = 'landed'; f.t = 0; f.x = tx; f.y = ty; say(C.pick(SAY.fly), 1.2); C.haptics.medium(); C.audio.pop(); } }
    else if (f.state === 'landed') { f.x = STACK_X + G.offset + Math.sin(g.t * 6) * 4; f.y = topY() - 26; if (f.t > 2.6) { if (G.stack.length) { G.stack.pop(); G.combo = 0; g.fx.text(STACK_X + G.offset, topY() - 40, 'KUNDEN VÄGRAR DEN KAKAN', '#FF6B6B', 16, 1.6); g.fx.shake = 8; C.haptics.fail(); C.audio.buzz(); } f.state = 'flee'; f.vx = 400; f.t = 0; } }
    else { f.x += f.vx * dt; f.y -= 300 * dt; if (f.t > 1) G.fly = null; }
  }
}
function drawCake(ctx, x, y, r, color, t, scaleY = 1, bubbles = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, scaleY);
  ctx.beginPath(); ctx.ellipse(0, t / 2, r, r * 0.42, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0, t / 2, r, r * 0.42, 0, 0, Math.PI); ctx.lineTo(-r, 0); ctx.ellipse(0, 0, r, r * 0.42, 0, Math.PI, 0, true); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(0, t / 2, r, r * 0.42, 0, 0, Math.PI); ctx.lineTo(-r, 0); ctx.ellipse(0, 0, r, r * 0.42, 0, Math.PI, 0, true); ctx.closePath(); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.12, r * 0.4, r * 0.14, 0, 0, Math.PI * 2); ctx.fill();
  if (bubbles > 0) { ctx.fillStyle = 'rgba(255,255,255,.5)'; for (let k = 0; k < 7; k++) { const a = k * 1.9 + g.t * 0.5, rr = r * (0.2 + (k % 3) * 0.2); ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr * 0.4, 2 + (k % 2) * bubbles * 2, 0, Math.PI * 2); ctx.fill(); } }
  ctx.restore();
}
function drawFace(ctx) {
  const f = G.face, my = mouthY(), cx = STACK_X, cy = my - 78, R = 112;
  let open = 22 + 20 * Math.min(1, stackH() / G.targetH);
  if (G.anim && G.syrup.length) { const k = G.anim.t / G.anim.dur; open = k < 0.5 ? lerp0(open, 3, k / 0.5) : lerp0(3, 14, (k - 0.5) / 0.5); }
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = f.skin; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(40,20,10,.5)'; ctx.stroke();
  const c = G.cake, lx = c && c.state !== 'fly' ? -8 : 0;
  for (const s of [-1, 1]) { const ex = cx + s * 44, ey = cy - 28; ctx.beginPath(); ctx.ellipse(ex, ey, 18, f.blink > 0 ? 2 : 20, 0, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); if (f.blink <= 0) { ctx.beginPath(); ctx.arc(ex + lx, ey + 5, 8, 0, Math.PI * 2); ctx.fillStyle = '#2B1600'; ctx.fill(); } const anger = Math.min(1, stackH() / G.targetH); ctx.beginPath(); ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#2B1600'; ctx.moveTo(ex - 18, ey - 30 + (s > 0 ? anger * 8 : 0)); ctx.lineTo(ex + 18, ey - 30 + (s < 0 ? anger * 8 : 0)); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(cx, my, 100, open, 0, 0, Math.PI * 2); ctx.fillStyle = '#5A0F1A'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, my + open * 0.55, 50, open * 0.45, 0, 0, Math.PI * 2); ctx.fillStyle = '#E2555E'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, my, 100, open, 0, 0, Math.PI * 2); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(40,20,10,.5)'; ctx.stroke();
  ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(255,246,227,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - 120, my); ctx.lineTo(cx + 120, my); ctx.stroke(); ctx.setLineDash([]);
  if (G.bubble && G.bubble.until > g.t) { const b = G.bubble, pop = Math.min(1, (g.t - b.born) / 0.12), bw = Math.min(g.W - 24, 40 + b.text.length * 11.5), bx = Math.min(g.W - bw / 2 - 8, cx), by = Math.max(60, cy - R - 40); ctx.save(); ctx.translate(bx, by); ctx.scale(pop, pop); ctx.translate(-bx, -by); C.rrect(ctx, bx - bw / 2, by - 20, bw, 40, 12); ctx.fillStyle = '#FFF6E3'; ctx.fill(); C.text(ctx, b.text, bx, by + 1, 18, '#2B1600', 'center', C.F.display, false); ctx.restore(); }
}
const lerp0 = (a, b, t) => a + (b - a) * t;
function render(ctx) {
  const W = g.W, H = g.H;
  ctx.save(); g.fx.applyShake(ctx);
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#3B2417'); gr.addColorStop(1, '#5A3A25'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2A1810'; ctx.fillRect(0, plateY() + 16, W, H - plateY() - 16); ctx.fillStyle = '#7A5238'; ctx.fillRect(0, plateY() + 16, W, 4);
  if (G.screen !== 'menu') {
    drawFace(ctx);
    // plate + stack
    ctx.beginPath(); ctx.ellipse(STACK_X, plateY() + 6, 96, 16, 0, 0, Math.PI * 2); ctx.fillStyle = '#FFF6E3'; ctx.fill(); ctx.beginPath(); ctx.ellipse(STACK_X, plateY() + 4, 78, 10, 0, 0, Math.PI * 2); ctx.fillStyle = '#E7D8C0'; ctx.fill();
    let y = plateY(); const wob = Math.sin(g.t * 9) * G.wobble * Math.min(1, Math.abs(G.offset) / TOPPLE) * 4;
    const toppleK = G.anim && G.toppleDir ? C.easeIn(G.anim.t / G.anim.dur) : 0;
    G.stack.forEach((p, i) => { y -= p.t; const k = (i + 1) / Math.max(1, G.stack.length); const td = G.toppleDir || 0; const tx = STACK_X + p.x + wob * k + toppleK * td * 220 * k, ty = y + toppleK * 120 * k; ctx.save(); if (toppleK) { ctx.translate(tx, ty); ctx.rotate(toppleK * td * 1.2 * k); ctx.translate(-tx, -ty); } const age = g.t - p.born, sq = age < 0.15 ? Math.sin(age / 0.15 * Math.PI) * 0.25 : 0; drawCake(ctx, tx, ty + p.t * sq, PANCAKE_R, p.color, p.t, 1 - sq * 0.4); if (p.butter && i === G.stack.length - 1) { ctx.fillStyle = '#FFE066'; C.rrect(ctx, tx - 9, ty - 12, 18, 10, 2); ctx.fill(); } ctx.restore(); });
    for (const s of G.syrup) { ctx.fillStyle = 'rgba(200,120,30,' + Math.max(0, 1 - s.t) + ')'; ctx.fillRect(s.x, s.y, 4, 14); }
