<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fikapausen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
:root{--ground:#2A2320;--panel:rgba(30,24,20,.9);--cream:#FFF3E0;--dim:#C9B8A8;--accent:#C8873E;--accent-shadow:#7C4F1F;--btn-text:#2B1600;--card:#3E332D;--card-dk:#2A2320;--line:#5C4A40;--how-cols:3;color-scheme:dark}
</style>
<script src="lib/core.js"></script>
</head>
<body>
<div id="stage"><div id="box"><div id="frame">
<div id="menu" class="ov">
  <h1 class="logo">FIKAPAUSEN</h1>
  <p class="sub">Doppa kexet. Ju mjukare desto mer poäng. Går det av i kaffet är det plums. Och chefen kan komma när som helst.</p>
  <div class="how" aria-label="Så här spelar du">
    <div><b>HÅLL</b>doppa</div>
    <div><b>⇡</b>ät</div>
    <div><b>👔</b>chefen: ät direkt</div>
  </div>
  <button class="btn" id="bPlay">FIKA</button>
  <div class="row">
    <button class="btn sec" id="bDaily">Dagens kex</button>
    <button class="btn sec" id="bDuel">Turas om · 2 spelare</button>
  </div>
  <div class="row">
    <button class="btn sec" id="bHap">Vibration: på</button>
    <button class="btn sec" id="bSnd">Ljud: på</button>
  </div>
  <p class="small" id="bestLine"></p>
  <p class="small" id="challengeLine" hidden></p>
</div>
<div id="over" class="ov" hidden>
  <p class="tag" id="overTag">FIKAT ÄR SLUT</p>
  <p class="big" id="overScore">0</p>
  <p class="sub" id="overSub"></p>
  <button class="btn" id="bAgain">IGEN</button>
  <button class="btn" id="bNextPlayer" hidden>SPELARE 2 – FIKA</button>
  <div class="row">
    <button class="btn sec" id="bShare">Utmana en vän</button>
    <button class="btn sec" id="bMenu">Meny</button>
  </div>
  <input id="linkbox" class="linkbox" hidden readonly aria-label="Utmaningslänk">
  <p class="small" id="overHint">Tryck var som helst för att köra igen</p>
</div>
<div id="toast" role="status"></div>
</div></div></div>
<script>
(() => {
'use strict';
const C = Core, $ = C.$;
const S = C.store('fika');
C.haptics.on = S.get('haptics', true); C.audio.on = S.get('sound', true);
const TYPES = [
  { n: 'DIGESTIVE', base: 2.6, w: 92, h: 92, round: true, c: '#C8873E', c2: '#A66B2A' },
  { n: 'BALLERINA', base: 2.0, w: 104, h: 54, round: false, c: '#E3B36E', c2: '#6B3E1E', filled: true },
  { n: 'MARIEKEX', base: 1.4, w: 92, h: 92, round: true, c: '#F0D6A8', c2: '#D6B57E', thin: true },
  { n: 'PEPPARKAKA', base: 0.9, w: 96, h: 90, heart: true, c: '#8A4B22', c2: '#5A2E12' },
  { n: 'CHOKLADKEX', base: 1.7, w: 64, h: 112, round: false, c: '#5A2E12', c2: '#3A1C0A', stripes: true },
];
const G = { screen: 'menu', mode: 'free', seed: '', i: 0, kex: null, lives: 3, score: 0, combo: 0, bestCombo: 0, boss: null, anim: null, overReadyAt: 0, duel: { turn: 0, scores: [0, 0] }, challengeSeed: null, challengeScore: 0, ripples: [], crumbs: [], eaten: 0, perfects: 0, round: 1 };
const cupY = () => g.H * 0.62, cupX = () => g.W / 2, mouthY = () => 96;
const DUEL_N = 10;

function startRun(mode, seed) {
  G.mode = mode; G.seed = seed; G.screen = 'play'; G.i = 0; G.lives = 3; G.score = 0; G.combo = 0; G.bestCombo = 0; G.boss = null; G.anim = null; G.ripples = []; G.crumbs = []; G.eaten = 0; G.perfects = 0; G.round = 1;
  C.ui.hideAll(); newKex();
}
function startGame(mode) {
  const seed = mode === 'daily' ? 'daily-' + C.todayStr() : mode === 'challenge' ? G.challengeSeed : C.newSeed();
  if (mode === 'duel') G.duel = { turn: 0, scores: [0, 0] };
  startRun(mode, seed);
  C.ui.toast(mode === 'duel' ? 'Spelare 1 tar ' + DUEL_N + ' kex, sedan spelare 2 samma kex.' : 'Håll för att doppa. Swipa upp för att äta.', 2200);
}
function newKex() {
  const i = G.i, r = C.rngAt(G.seed, i), a = r(), b = r(), c = r();
  const type = TYPES[Math.floor(a * TYPES.length)];
  const heat = 1 + 0.12 * (G.round - 1);
  G.kex = { type, T: type.base * (0.85 + 0.3 * b) / heat, s: 0, state: 'idle', y: 0, droop: 0, window: 0, t: 0, i };
  G.boss = null;
  if (i >= 3 && c < 0.25) { G.boss = { at: 0.6 + r() * 2.4, t: 0, state: 'wait' }; }
}
function dunk() { const k = G.kex; if (!k || k.state !== 'idle' || G.anim) return; k.state = 'dunk'; k.t = 0; C.haptics.light(); C.audio.splash(); G.ripples.push({ t: 0 }); }
function lift() { const k = G.kex; if (!k || k.state !== 'dunk') return; k.state = 'lifted'; k.t = 0; k.window = Math.max(0.3, 1.5 * (1 - k.s / k.T)); C.haptics.tick(); C.audio.tone(300, 0.08, 'sine', 0.05, -100); }
function eat() {
  const k = G.kex; if (!k || (k.state !== 'lifted' && k.state !== 'dunk') || G.anim) return;
  if (k.state === 'dunk') lift();
  const ratio = k.s / k.T; k.state = 'eat'; k.t = 0;
  let pts = Math.round(ratio * 100), label;
  if (ratio >= 0.9) { G.combo++; G.perfects++; pts += 50; label = 'PERFEKT DOPP! +' + pts; C.haptics.success(G.combo); C.audio.blip(G.combo); g.fx.ring(cupX(), cupY() - 120, '#C8873E'); }
  else if (ratio >= 0.6) { G.combo = 0; label = Math.round(ratio * 100) + '% MJUKT +' + pts; C.haptics.medium(); C.audio.crunch(); }
  else if (ratio >= 0.3) { G.combo = 0; label = 'LITE TORRT +' + pts; C.haptics.light(); C.audio.pop(); }
  else { G.combo = 0; label = 'TORRT. FEG. +' + pts; C.haptics.tick(); C.audio.pop(); }
  G.bestCombo = Math.max(G.bestCombo, G.combo); G.score += pts; G.eaten++;
  g.fx.text(cupX(), mouthY() + 60, label, ratio >= 0.9 ? '#C8873E' : '#FFF3E0', ratio >= 0.9 ? 26 : 20, 1.1);
  G.anim = { t: 0, dur: 0.35, after: next };
}
function broke(reason) {
  const k = G.kex; k.state = 'broke'; k.t = 0; G.combo = 0; G.lives--;
  g.fx.text(cupX(), cupY() - 120, reason === 'boss' ? 'AVSLÖJAD!' : 'PLUMS!', '#FF6B6B', 34, 1.3);
  if (reason === 'boss') g.fx.text(cupX(), cupY() - 84, '"Sitter du och doppar?!"', '#FFF3E0', 16, 2);
  g.fx.shake = 12; C.haptics.fail(); C.audio.buzz(); G.ripples.push({ t: 0 }); G.ripples.push({ t: -0.2 });
  for (let n = 0; n < 8; n++) G.crumbs.push({ x: cupX() + (Math.random() - 0.5) * 60, y: cupY() - 10, vy: -100 - Math.random() * 100, vx: (Math.random() - 0.5) * 120, t: 0 });
  G.anim = { t: 0, dur: 0.8, after: () => { if (G.lives <= 0) showOver(); else next(); } };
}
function next() {
  G.i++;
  if (G.mode === 'duel' && G.i >= DUEL_N) { showOver(); return; }
  if (G.i % 10 === 0) { G.round++; g.fx.text(cupX(), cupY() - 150, 'PÅTÅR! HETARE KAFFE', '#C8873E', 22, 1.6); C.haptics.medium(); C.audio.chord(); }
  newKex();
}
function update(dt) {
  if (G.screen !== 'play') return;
  for (const r of G.ripples) r.t += dt; G.ripples = G.ripples.filter(r => r.t < 1);
  for (const c of G.crumbs) { c.t += dt; c.vy += 500 * dt; c.x += c.vx * dt; c.y += c.vy * dt; } G.crumbs = G.crumbs.filter(c => c.t < 1.2);
  if (G.anim) { G.anim.t += dt; if (G.anim.t >= G.anim.dur) { const a = G.anim; G.anim = null; a.after(); } return; }
  const k = G.kex; if (!k) return;
  k.t += dt;
  if (k.state === 'dunk') { k.y = Math.min(1, k.y + dt * 7); k.s += dt * k.y; if (k.s >= k.T) { broke('soft'); return; } if (Math.floor(k.s * 8) !== Math.floor((k.s - dt) * 8)) { C.haptics.tick(); if (k.s / k.T > 0.7) C.audio.tone(200 + k.s / k.T * 300, 0.04, 'sine', 0.03); } }
  else if (k.state === 'lifted') { k.y = Math.max(0, k.y - dt * 7); k.droop = Math.min(1, k.t / k.window); if (k.t >= k.window) { broke('droop'); return; } }
  else if (k.state === 'idle') { k.y = Math.max(0, k.y - dt * 7); }
  if (G.boss) {
    const b = G.boss;
    if (b.state === 'wait') { if (k.t >= b.at && (k.state === 'dunk' || k.state === 'lifted' || k.state === 'idle')) { b.state = 'steps'; b.t = 0; g.fx.text(g.W - 70, g.H * 0.36, 'STEG I KORRIDOREN…', '#C9B8A8', 13, 0.9); C.haptics.medium(); C.audio.noise(0.15, 0.2, 200); } }
    else if (b.state === 'steps') { b.t += dt; if (b.t > 0.8) { b.state = 'in'; b.t = 0; g.fx.text(g.W - 70, g.H * 0.36, 'CHEFEN!', '#FF6B6B', 26, 1.2); C.haptics.big(); C.audio.buzz(); } }
    else if (b.state === 'in') { b.t += dt; if (k.state === 'dunk' || k.state === 'lifted') { broke('boss'); G.boss = null; return; } if (b.t > 1.4) { b.state = 'gone'; b.t = 0; g.fx.text(g.W - 70, g.H * 0.36, 'PUH.', '#C9B8A8', 16, 0.8); } }
    else if (b.state === 'gone') { b.t += dt; if (b.t > 1) G.boss = null; }
  }
}
function showOver() {
  G.screen = 'over'; G.overReadyAt = performance.now() + 500;
  if (G.mode === 'duel') {
    G.duel.scores[G.duel.turn] = G.score;
    if (G.duel.turn === 0) { C.ui.setText('overTag', 'SPELARE 1 KLAR'); C.ui.setText('overScore', String(G.score)); C.ui.setText('overSub', 'Spelare 2 får exakt samma kex. Slå ' + G.score + '!'); $('bAgain').hidden = true; $('bNextPlayer').hidden = false; $('bShare').hidden = true; $('overHint').hidden = true; }
    else { const [a, b] = G.duel.scores, w = a === b ? 0 : a > b ? 1 : 2; C.ui.setText('overTag', w ? 'SPELARE ' + w + ' VANN' : 'OAVGJORT'); C.ui.setText('overScore', a + ' – ' + b); C.ui.setText('overSub', 'Samma kex, samma kaffe. Ny fika?'); $('bAgain').hidden = false; $('bAgain').textContent = 'NY DUELL'; $('bNextPlayer').hidden = true; $('bShare').hidden = true; $('overHint').hidden = false; }
    $('linkbox').hidden = true; C.ui.show('over'); return;
  }
  const key = G.mode === 'daily' ? 'daily.' + C.todayStr() : 'best';
  const best = S.get(key, 0), rec = G.score > best; if (rec) S.set(key, G.score);
  C.ui.setText('overTag', (G.mode === 'daily' ? 'DAGENS KEX · ' : G.mode === 'challenge' ? 'UTMANING · ' : '') + 'FIKAT ÄR SLUT');
  C.ui.setText('overScore', String(G.score));
  let sub = (rec ? 'NYTT REKORD!' : 'Bästa: ' + best) + ' · ' + G.eaten + ' kex · ' + G.perfects + ' perfekta dopp';
  if (G.mode === 'challenge') sub += G.score > G.challengeScore ? ' · Du slog din vän (' + G.challengeScore + ')! 🏆' : ' · Din vän hade ' + G.challengeScore + '.';
  C.ui.setText('overSub', sub);
  $('bAgain').hidden = false; $('bAgain').textContent = 'IGEN'; $('bNextPlayer').hidden = true; $('bShare').hidden = false; $('overHint').hidden = false; $('linkbox').hidden = true;
  if (rec && best > 0) { C.haptics.win(); C.audio.fanfare(); }
  updateBest(); C.ui.show('over');
}
function restart() {
  if (G.mode === 'duel' && G.duel.turn === 0 && G.screen === 'over') { G.duel.turn = 1; startRun('duel', G.seed); C.ui.toast('Spelare 2: samma kex. Doppa!', 1600); return; }
  if (G.mode === 'duel') { startGame('duel'); return; }
  startGame(G.mode);
}
function goMenu() { G.screen = 'menu'; C.ui.hideAll(); C.ui.show('menu'); updateBest(); }
function updateBest() { const b = S.get('best', 0), d = S.get('daily.' + C.todayStr(), 0); C.ui.setText('bestLine', (b ? 'Bästa: ' + b : 'Inget rekord än') + (d ? ' · Dagens: ' + d : '')); }
function share() { const url = location.href.split('#')[0] + '#s=' + encodeURIComponent(G.seed) + '&t=' + G.score; C.share({ text: 'FIKAPAUSEN ☕ ' + G.score + ' p, ' + G.perfects + ' perfekta dopp. Samma kex, slå mig:', url, linkboxId: 'linkbox' }); }

function drawKex(ctx, k, x, y, coffeeLine) {
  const t = k.type, ratio = Math.min(1, k.s / k.T), bend = ratio * 0.9 + k.droop * 1.2;
  ctx.save(); ctx.translate(x, y);
  const w = t.w, h = t.h;
  const shape = () => { ctx.beginPath(); if (t.round) ctx.arc(0, 0, w / 2, 0, Math.PI * 2); else if (t.heart) { ctx.moveTo(0, h / 2); ctx.bezierCurveTo(-w * 0.7, -h * 0.1, -w * 0.4, -h * 0.7, 0, -h * 0.25); ctx.bezierCurveTo(w * 0.4, -h * 0.7, w * 0.7, -h * 0.1, 0, h / 2); } else C.rrect(ctx, -w / 2, -h / 2, w, h, 10); };
  // bend: skew lower part
  ctx.transform(1, 0, 0, 1, 0, 0);
  const sk = bend * 0.35;
  ctx.transform(1, 0, sk * (k.state === 'lifted' ? 1 : 0.3), 1, 0, 0);
  shape(); ctx.fillStyle = t.c; ctx.fill();
  if (t.stripes) { ctx.fillStyle = t.c2; for (let yy = -h / 2 + 10; yy < h / 2; yy += 18) ctx.fillRect(-w / 2 + 6, yy, w - 12, 8); }
  if (t.filled) { ctx.fillStyle = t.c2; ctx.fillRect(-w / 2 + 6, -4, w - 12, 8); }
  if (t.round && !t.thin) { ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let a = 0; a < 12; a++) { ctx.beginPath(); ctx.arc(Math.cos(a) * w * 0.3, Math.sin(a) * w * 0.3, 2.5, 0, Math.PI * 2); ctx.fill(); } }
  if (t.thin) { ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, w / 2 - 8, 0, Math.PI * 2); ctx.stroke(); }
  if (t.heart) { ctx.fillStyle = '#FFF3E0'; ctx.beginPath(); ctx.arc(-14, -14, 3, 0, Math.PI * 2); ctx.arc(14, -14, 3, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#FFF3E0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 4, 12, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  // soaked part: darker below the coffee line (relative)
  const soak = ratio;
  if (soak > 0) { ctx.save(); shape(); ctx.clip(); const from = h / 2 - h * soak * 0.95; const gr = ctx.createLinearGradient(0, from - 10, 0, h / 2); gr.addColorStop(0, 'rgba(60,30,10,0)'); gr.addColorStop(0.2, 'rgba(60,30,10,.55)'); gr.addColorStop(1, 'rgba(40,20,5,.8)'); ctx.fillStyle = gr; ctx.fillRect(-w, from - 10, w * 2, h); ctx.restore(); }
  shape(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(30,15,5,.45)'; ctx.stroke();
  ctx.restore();
}
function render(ctx) {
  const W = g.W, H = g.H, cx = cupX(), cy = cupY();
  ctx.save(); g.fx.applyShake(ctx);
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#2A2320'); gr.addColorStop(1, '#4A3A30'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#6B4F3A'; ctx.fillRect(0, cy + 90, W, H - cy - 90); ctx.fillStyle = 'rgba(255,255,255,.06)'; for (let y = cy + 100; y < H; y += 20) ctx.fillRect(0, y, W, 2);
  if (G.screen !== 'menu') {
    const k = G.kex;
    // mouth at top
    ctx.beginPath(); ctx.arc(cx, mouthY() - 70, 96, 0, Math.PI * 2); ctx.fillStyle = '#F5C6A0'; ctx.fill();
    const open = k && k.state === 'eat' ? 6 : 16 + (k && k.state === 'lifted' ? 14 : 0);
    ctx.beginPath(); ctx.ellipse(cx, mouthY(), 40, open, 0, 0, Math.PI * 2); ctx.fillStyle = '#5A0F1A'; ctx.fill();
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * 36, mouthY() - 60, 8, 0, Math.PI * 2); ctx.fillStyle = '#2B1600'; ctx.fill(); }
    // door + boss
    ctx.fillStyle = '#3E332D'; ctx.fillRect(W - 120, H * 0.2, 110, H * 0.3); ctx.fillStyle = '#2A2320'; ctx.fillRect(W - 112, H * 0.2 + 8, 94, H * 0.3 - 8);
    if (G.boss && (G.boss.state === 'in' || G.boss.state === 'gone')) { const bx = W - 65 + (G.boss.state === 'gone' ? G.boss.t * 90 : 0), by = H * 0.36; ctx.fillStyle = '#E0AC69'; ctx.beginPath(); ctx.arc(bx, by, 34, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#2B1600'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(bx - 12, by - 4, 9, 0, Math.PI * 2); ctx.moveTo(bx + 21, by - 4); ctx.arc(bx + 12, by - 4, 9, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = '#2B1600'; ctx.beginPath(); ctx.arc(bx - 12, by - 2, 3, 0, Math.PI * 2); ctx.arc(bx + 12, by - 2, 3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(bx - 10, by + 16); ctx.lineTo(bx + 10, by + 16); ctx.stroke(); ctx.fillStyle = '#3E7BFF'; ctx.fillRect(bx - 6, by + 34, 12, 30); }
    else if (G.boss && G.boss.state === 'steps') { C.text(ctx, '👣', W - 65, H * 0.36 + Math.sin(g.t * 20) * 4, 28, '#fff', 'center', C.F.emoji, false); }
    // cup
    ctx.fillStyle = '#FFF3E0'; C.rrect(ctx, cx - 110, cy, 220, 150, 24); ctx.fill();
    ctx.fillStyle = '#FFF3E0'; ctx.beginPath(); ctx.arc(cx + 130, cy + 70, 40, -Math.PI / 2, Math.PI / 2); ctx.lineTo(cx + 110, cy + 110); ctx.lineTo(cx + 110, cy + 30); ctx.fill(); ctx.fillStyle = '#4A3A30'; ctx.beginPath(); ctx.arc(cx + 130, cy + 70, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3E7BFF'; ctx.fillRect(cx - 110, cy + 60, 220, 14); ctx.fillStyle = '#FFD23F'; for (let x = cx - 100; x < cx + 100; x += 28) ctx.fillRect(x, cy + 64, 8, 6);
    ctx.beginPath(); ctx.ellipse(cx, cy, 110, 24, 0, 0, Math.PI * 2); ctx.fillStyle = '#E7D8C0'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, cy, 96, 18, 0, 0, Math.PI * 2); ctx.fillStyle = '#3B2417'; ctx.fill();
    for (const r of G.ripples) { ctx.beginPath(); ctx.ellipse(cx, cy, 20 + r.t * 70, (20 + r.t * 70) * 0.19, 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,243,224,' + (1 - r.t) * 0.6 + ')'; ctx.lineWidth = 2; ctx.stroke(); }
    // steam
    for (let n = 0; n < 3; n++) { const ph = g.t * 1.2 + n * 2; ctx.strokeStyle = 'rgba(255,243,224,' + (0.12 + 0.08 * Math.sin(ph)) + ')'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(cx - 40 + n * 40, cy - 20); ctx.quadraticCurveTo(cx - 40 + n * 40 + Math.sin(ph) * 14, cy - 60, cx - 40 + n * 40, cy - 100); ctx.stroke(); }
    for (const c of G.crumbs) { ctx.fillStyle = 'rgba(200,135,62,' + (1 - c.t / 1.2) + ')'; ctx.fillRect(c.x, c.y, 4, 4); }
    // kex
    if (k) {
      const hold = cy - 150, dip = cy - 34;
      if (k.state === 'eat') { const q = k.t / 0.35, y = C.lerp(hold, mouthY() + 10, C.easeIn(q)); ctx.save(); ctx.globalAlpha = 1 - q * 0.6; drawKex(ctx, k, cx, y, cy); ctx.restore(); }
      else if (k.state === 'broke') { const q = k.t / 0.8; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - q * 1.6); drawKex(ctx, k, cx, C.lerp(dip, cy + 40, q), cy); ctx.restore(); }
      else { const y = C.lerp(hold, dip, k.y); if (k.y > 0.05) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, cy); ctx.clip(); drawKex(ctx, k, cx, y, cy); ctx.restore(); ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, 96, 18, 0, 0, Math.PI * 2); ctx.clip(); ctx.globalAlpha = 0.35; drawKex(ctx, k, cx, y, cy); ctx.restore(); } else drawKex(ctx, k, cx, y, cy); }
      // hand (finger holding)
      if (k.state !== 'eat' && k.state !== 'broke') { const y = C.lerp(hold, dip, k.y) - k.type.h / 2; ctx.fillStyle = '#F5C6A0'; C.rrect(ctx, cx - 14, y - 60, 28, 62, 12); ctx.fill(); C.rrect(ctx, cx + 10, y - 40, 22, 40, 10); ctx.fill(); }
      // softness meter
      const ratio = Math.min(1, k.s / k.T);
      C.rrect(ctx, 24, cy - 200, 18, 180, 8); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
      const gm = ctx.createLinearGradient(0, cy - 20, 0, cy - 200); gm.addColorStop(0, '#E3B36E'); gm.addColorStop(0.6, '#C8873E'); gm.addColorStop(0.9, '#8A4B22'); gm.addColorStop(1, '#FF6B6B');
      ctx.fillStyle = gm; ctx.fillRect(26, cy - 20 - 176 * ratio, 14, 176 * ratio);
      ctx.fillStyle = 'rgba(255,243,224,.6)'; ctx.fillRect(22, cy - 20 - 176 * 0.9, 22, 2);
