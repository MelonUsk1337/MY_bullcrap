<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nummerlappen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
:root{--ground:#0B2A5B;--panel:rgba(8,26,56,.92);--cream:#FFF8E7;--dim:#B9C7DD;--accent:#FFCC33;--accent-shadow:#A67C00;--btn-text:#1A1400;--card:#16407A;--card-dk:#0B2A5B;--line:#2E5A9E;--how-cols:3;color-scheme:dark}
</style>
<script src="lib/core.js"></script>
</head>
<body>
<div id="stage"><div id="box"><div id="frame">
<div id="menu" class="ov">
  <h1 class="logo" style="font-size:clamp(38px,12vw,58px)">NUMMERLAPPEN</h1>
  <p class="sub">Du är ny i Sverige. Svenskarna har regler de inte kan förklara. Lär dig dem snabbare än de kan. Två universalsvar finns alltid: fika och nummerlapp.</p>
  <div class="how" aria-label="Så här spelar du">
    <div><b>⇠ ⇢</b>välj svar</div>
    <div><b>⇡</b>föreslå fika</div>
    <div><b>⇣</b>ta en nummerlapp</div>
  </div>
  <button class="btn" id="bPlay">BLI SVENSK</button>
  <div class="row">
    <button class="btn sec" id="bDaily">Dagens Sverige</button>
    <button class="btn sec" id="bDuel">Kulturkrock · 2 spelare</button>
  </div>
  <div class="row">
    <button class="btn sec" id="bHap">Vibration: på</button>
    <button class="btn sec" id="bSnd">Ljud: på</button>
  </div>
  <p class="small" id="bestLine"></p>
  <p class="small" id="challengeLine" hidden></p>
</div>
<div id="over" class="ov" hidden>
  <p class="tag" id="overTag">UTVISAD TILL KÖN</p>
  <p class="big" id="overScore">0</p>
  <p class="sub" id="overSub"></p>
  <button class="btn" id="bAgain">IGEN</button>
  <button class="btn" id="bNextPlayer" hidden>SPELARE 2 – KÖR</button>
  <div class="row">
    <button class="btn sec" id="bShare">Utmana en vän</button>
    <button class="btn sec" id="bMenu">Meny</button>
  </div>
  <input id="linkbox" class="linkbox" hidden readonly aria-label="Utmaningslänk">
  <p class="small" id="overHint">Tryck var som helst för att köra igen</p>
</div>
<div id="toast" role="status"></div>
</div></div></div>
<script>
(() => {
'use strict';
const C = Core, $ = C.$;
const S = C.store('nummerlappen');
C.haptics.on = S.get('haptics', true); C.audio.on = S.get('sound', true);
// Every card pokes at Swedish unwritten rules and bureaucracy. The player is the newcomer and the hero.
const DECK = [
  { cat: 'BUSSEN', q: 'Bussen är halvfull. En tom dubbelplats längre bak, ett ledigt säte bredvid någon närmare.', l: 'Sätt dig bredvid', r: 'Gå längre bak', a: 'right', why: 'Aldrig bredvid någon om det finns en tom dubbelplats. Det är inte oartigt, det är omtanke.' },
  { cat: 'TVÄTTSTUGAN', q: 'Grannen har bokat tvättstugan 14–17. Klockan 14:20 är den tom.', l: 'Ta tiden', r: 'Vänta', a: 'right', why: 'Tvättstugetiden är helig. Folk har flyttat för mindre.' },
  { cat: 'JOBBET', q: 'Klockan 14:30 reser sig alla kollegor samtidigt utan att säga något.', l: 'Fortsätt jobba', r: 'Fråga om det brinner', a: 'up', why: 'Fika är obligatoriskt och oskrivet. Sitter du kvar tror de att du är arg på dem.' },
  { cat: 'BANKEN', q: 'Banken: "Vi behöver ditt personnummer." Skatteverket: "Vi behöver en adress." Hyresvärden: "Vi behöver ett bankkonto."', l: 'Börja om på banken', r: 'Ring Skatteverket igen', a: 'down', why: 'Ingen kan lösa loopen. Ta en nummerlapp, sätt dig, vänta. Det är hela systemet.' },
  { cat: 'SMÅPRAT', q: 'Grannen säger: "Det ska bli fint väder i helgen."', l: 'Berätta vad du tycker om regeringen', r: '"Ja, verkligen."', a: 'right', why: 'Väder är det enda småpratsämnet. Politik är för nära vänner, efter tre år.' },
  { cat: 'SYSTEMBOLAGET', q: 'Lördag 15:05. Du vill köpa vin till middagen.', l: 'Gå till Systembolaget', r: 'Servera saft', a: 'right', why: 'Stängde 15:00. Alla svenskar bär detta trauma.' },
  { cat: 'MIDSOMMAR', q: 'Alla ställer sig i ring runt en stång och hoppar som grodor.', l: 'Fråga varför', r: 'Hoppa', a: 'right', why: 'Ingen vet varför. Fråga inte. Hoppa.' },
  { cat: 'ARTIGHET', q: 'Du möter någon du åt middag hos för två veckor sedan.', l: '"Hej!"', r: '"Tack för senast!"', a: 'right', why: 'Man tackar för en middag i upp till ett år. Sedan preskriberas den.' },
  { cat: 'HALLEN', q: 'Du kommer hem till någon. Hallen är full av skor.', l: 'Ta av skorna', r: 'Behåll dem på, det är ju fest', a: 'left', why: 'Skorna åker av. Även på fest. Även med finskor. Strumpor är festkläder.' },
  { cat: 'HÅLLPLATSEN', q: 'Folk står och väntar vid busshållplatsen, till synes huller om buller.', l: 'Ställ dig var som helst', r: 'Ställ dig sist i den osynliga kön', a: 'right', why: 'Det finns alltid en kö. Alla vet exakt vem som kom före.' },
  { cat: 'BOSTAD', q: 'Du vill hyra en lägenhet i Stockholm.', l: 'Ring en mäklare', r: 'Fråga en kompis', a: 'down', why: 'Bostadskön är elva år. Ta en nummerlapp. Den är metaforisk.' },
  { cat: 'LAGOM', q: 'Kollegan frågar hur helgen var. Den var fantastisk.', l: '"Helt otrolig, bäst i mitt liv!"', r: '"Jo, det var bra."', a: 'right', why: 'Lagom. Aldrig mer än "bra". "Riktigt bra" är nästan skryt.' },
  { cat: 'SFI', q: 'Läraren säger: "Sju sjösjuka sjömän." Alla tittar på dig.', l: 'Försök', r: 'Byt ämne till vädret', a: 'right', why: 'Det går inte. Inte ens svenskar kan förklara sj-ljudet. Vädret räddar alltid.' },
  { cat: 'TRAPPHUSET', q: 'Du möter grannen i trappen.', l: 'Prata i fem minuter', r: '"Hej." Titta ner. Gå.', a: 'right', why: 'Grannar hälsar, aldrig mer. Efter tio år kan man nicka.' },
  { cat: 'HISSEN', q: 'Du och en främling i hissen. Åtta våningar.', l: 'Tystnad. Stirra på knapparna.', r: 'Fråga vad hen jobbar med', a: 'left', why: 'Hissen är en tyst plats. Knapparna är mycket intressanta.' },
  { cat: 'KRÄFTSKIVAN', q: 'Alla har pappershattar och sjunger om en liten fågel före varje snaps.', l: 'Sjung med, du kan inte texten', r: 'Fråga vad låten betyder', a: 'left', why: 'Ingen kan texten. Alla sjunger. Det är poängen.' },
  { cat: 'JOBBET', q: 'Barnet är sjukt. Du ringer jobbet.', l: '"Jag vabbar."', r: '"Jag kommer in ändå."', a: 'left', why: 'Vabba är ett verb, en rättighet och en identitet.' },
  { cat: 'SKOGEN', q: 'Du hittar en skog full av blåbär. Den är inte din.', l: 'Plocka', r: 'Fråga markägaren', a: 'left', why: 'Allemansrätten. Bären är allas. Men fråga aldrig var någon plockar kantareller.' },
  { cat: 'RESTAURANGEN', q: 'Middag med nya vänner. Notan kommer.', l: 'Bjud alla', r: 'Swisha exakt din del, med ören', a: 'right', why: 'Att bjuda gör folk nervösa. Exakt delning är kärlek.' },
  { cat: 'KÖTTBULLAR', q: 'Någon säger att köttbullarna egentligen är turkiska.', l: 'Håll med', r: 'Byt ämne till vädret', a: 'right', why: 'Debatten har pågått sedan 2018. Vädret är säkrare mark.' },
  { cat: 'FIKAT', q: 'Du blir hembjuden på fika. Det står sju sorters kakor på bordet.', l: 'Ta en', r: 'Ta en av varje', a: 'right', why: 'Sju sorter är inte skryt, det är ett minimum. Tar du inte av alla blir någon ledsen.' },
  { cat: 'KAFFET', q: '"Vill du ha mer kaffe?" Du vill ha mer.', l: '"Nej tack." Vänta. "Jo, lite."', r: '"Ja tack!"', a: 'left', why: 'Första erbjudandet är en artighet. Man tackar nej en gång. Alla vet.' },
  { cat: 'TÅGET', q: 'Tåget är 40 minuter sent.', l: 'Klaga högt', r: 'Sucka tyst och öppna appen', a: 'right', why: 'Man suckar. Man öppnar appen. Man berättar om det i tre år.' },
  { cat: 'MAJ', q: 'Det är 18 grader och sol.', l: 'Jacka', r: 'Shorts, uteservering, "äntligen sommar"', a: 'right', why: 'Sommaren är en känsla, inte en temperatur.' },
  { cat: 'MÖTET', q: 'Chefen ber om din åsikt. Alla verkar redan överens.', l: 'Säg emot', r: '"Jag håller med, men kanske…"', a: 'right', why: 'Konsensus. Beslutet fattades redan vid fikat. Du missade fikat.' },
  { cat: 'MYNDIGHETEN', q: 'Du behöver BankID för att skaffa BankID.', l: 'Ring supporten', r: 'Ladda ner appen igen', a: 'down', why: 'Alla har varit där. Ta en nummerlapp. Sätt dig. Andas.' },
  { cat: 'FLYTTEN', q: 'Du ska byta adress hos Skatteverket, Försäkringskassan, banken, elbolaget och a-kassan.', l: 'Gör det online', r: 'Gör det på plats', a: 'down', why: 'Alla länkar leder till samma kö. Nummerlapp.' },
  { cat: 'SÄLLSKAPET', q: 'Det blir tyst i sällskapet i fyra sekunder.', l: 'Fyll tystnaden', r: 'Vänta, det är okej', a: 'up', why: 'Tystnad är okej i Sverige. Men fika är alltid rätt.' },
  { cat: 'JOBBET', q: 'Du vet inte hur du ska be kollegan om hjälp.', l: 'Skicka ett mejl', r: 'Gå fram och fråga', a: 'up', why: 'Allt löser sig över en kopp. Ingen har någonsin sagt nej till fika.' },
  { cat: 'LUCIA', q: '13 december, 06:30. Folk i vita klänningar med levande ljus på huvudet går genom kontoret.', l: 'Ring brandkåren', r: 'Ta en lussekatt och sjung', a: 'right', why: 'Det är tradition. Brandkåren är också där och sjunger.' },
  { cat: 'JULMARKNADEN', q: 'Någon räcker dig en kopp varm dryck med russin i.', l: 'Drick. Fråga inte.', r: 'Fråga om det är alkohol', a: 'left', why: 'Glögg. Russinen är en bonus. Mandlarna är en test.' },
  { cat: 'HOCKEYN', q: 'Sverige spelar. Alla har gult på sig.', l: 'Heja på motståndarna', r: 'Skaffa något gult', a: 'right', why: 'Det finns alltid något gult i en svensk garderob. Ingen vet varifrån.' },
  { cat: 'MÖTET', q: 'Mötet börjar 10:00. Klockan är 09:58.', l: 'Kom 10:03, det är bara tre minuter', r: 'Sitt redan på plats, med kaffe', a: 'right', why: '10:00 betyder 09:58. 10:03 är en förolämpning som ingen kommer nämna. Någonsin.' },
  { cat: 'NOVEMBER', q: 'Första snön. Bilarna kör i diket.', l: '"Snö i november, vem kunde ana"', r: 'Byt däck i tid', a: 'right', why: 'Vinterdäck den 1 december. Snön den 15 november. Varje år. Alla överraskade.' },
  { cat: 'ONSDAG', q: 'Barnet vill ha godis.', l: 'Ge godis', r: '"Det är inte lördag."', a: 'right', why: 'Lördagsgodis är lag. Inte i lagboken, men i alla hem.' },
  { cat: 'SEMESTERN', q: 'Det är juli. Du behöver få tag på någon på en myndighet.', l: 'Ring', r: 'Mejla', a: 'down', why: 'Sverige är stängt i juli. Nummerlappen gäller i augusti.' },
  { cat: 'SEMESTERN', q: 'Kollegan berättar om sin sommarstuga utan el och vatten. Med stolthet.', l: '"Varför?"', r: '"Vad härligt."', a: 'right', why: 'Att frysa i en stuga är lyx. Att fråga varför är oförskämt.' },
  { cat: 'SÄLLSKAPET', q: 'Du har bjudit hem folk. De kommer exakt 19:00 och står i hallen med skorna i handen.', l: 'Servera direkt', r: 'Släpp in dem', a: 'up', why: 'Först fika. Sedan mat. Sedan fika igen. Det är ett schema.' },
];
const G = { screen: 'menu', mode: 'free', seed: '', order: [], i: 0, card: null, leaving: null, lives: 3, score: 0, combo: 0, bestCombo: 0, timer: 0, timerMax: 0, verdict: null, flash: null, anim: null, overReadyAt: 0, duel: { turn: 0, scores: [0, 0] }, challengeSeed: null, challengeScore: 0, right: 0 };
const DUEL_N = 15;
const cardY = () => g.H * 0.5;

function shuffledOrder(seed) { const r = C.rngStream(seed); const idx = DECK.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }
function startRun(mode, seed) {
  G.mode = mode; G.seed = seed; G.screen = 'play'; G.order = shuffledOrder(seed); G.i = 0; G.lives = 3; G.score = 0; G.combo = 0; G.bestCombo = 0; G.verdict = null; G.flash = null; G.anim = null; G.leaving = null; G.right = 0;
  C.ui.hideAll(); nextCard();
}
function startGame(mode) {
  const seed = mode === 'daily' ? 'daily-' + C.todayStr() : mode === 'challenge' ? G.challengeSeed : C.newSeed();
  if (mode === 'duel') G.duel = { turn: 0, scores: [0, 0] };
  startRun(mode, seed);
  C.ui.toast(mode === 'duel' ? 'Spelare 1 tar ' + DUEL_N + ' situationer, sedan spelare 2 samma. Vem kan koderna?' : 'Läs. Swipa. Fika och nummerlapp löser mer än du tror.', 2600);
}
function nextCard() {
  if (G.i >= G.order.length || (G.mode === 'duel' && G.i >= DUEL_N)) { showOver('done'); return; }
  G.card = Object.assign({ enter: 0 }, DECK[G.order[G.i]]);
  G.timerMax = Math.max(3.2, 7 - 0.12 * G.i); G.timer = G.timerMax;
}
function decide(dir) {
  const c = G.card; if (!c || G.verdict || G.anim) return;
  const ok = dir === c.a;
  G.leaving = { card: c, dir, t: 0 }; G.card = null; G.flash = { dir, ok, t: 0.3 };
  const cx = g.W / 2;
  if (ok) { G.combo++; G.right++; G.bestCombo = Math.max(G.bestCombo, G.combo); let pts = 10 + 10 * Math.min(G.combo - 1, 9); if (G.timer > G.timerMax * 0.6) pts += 5; G.score += pts; g.fx.text(cx, cardY() - 150, (G.combo >= 3 ? 'x' + G.combo + ' ' : '') + 'SVENSKT! +' + pts, '#FFCC33', 26 + Math.min(G.combo, 6)); g.fx.ring(cx, cardY(), '#FFCC33'); C.haptics.success(G.combo); C.audio.blip(G.combo); }
  else { G.combo = 0; G.lives--; g.fx.shake = 12; C.haptics.fail(); C.audio.buzz(); }
  G.verdict = { ok, why: c.why, t: 0, dur: ok ? 1.9 : 2.8, right: c.a };
}
function timeout() {
  const c = G.card; if (!c) return;
  G.leaving = { card: c, dir: 'down', t: 0, slow: true }; G.card = null; G.combo = 0; G.lives--;
  g.fx.shake = 8; C.haptics.fail(); C.audio.buzz();
  G.verdict = { ok: false, why: 'För långsam. I Sverige har man redan bestämt sig och sagt "jaha". ' + c.why, t: 0, dur: 3, right: c.a, slow: true };
}
function endVerdict() {
  G.verdict = null; G.i++;
  if (G.lives <= 0) { showOver('lives'); return; }
  nextCard();
}
function showOver(reason) {
  G.screen = 'over'; G.overReadyAt = performance.now() + 500;
  if (G.mode === 'duel') {
    G.duel.scores[G.duel.turn] = G.score;
    if (G.duel.turn === 0) { C.ui.setText('overTag', 'SPELARE 1 KLAR'); C.ui.setText('overScore', String(G.score)); C.ui.setText('overSub', G.right + ' rätt av ' + G.i + '. Spelare 2 får samma situationer. Slå ' + G.score + '!'); $('bAgain').hidden = true; $('bNextPlayer').hidden = false; $('bShare').hidden = true; $('overHint').hidden = true; }
    else { const [a, b] = G.duel.scores, w = a === b ? 0 : a > b ? 1 : 2; C.ui.setText('overTag', w ? 'SPELARE ' + w + ' KAN KODERNA' : 'OAVGJORT. INGEN KAN KODERNA.'); C.ui.setText('overScore', a + ' – ' + b); C.ui.setText('overSub', 'Samma Sverige, samma regler. Ny kulturkrock?'); $('bAgain').hidden = false; $('bAgain').textContent = 'NY DUELL'; $('bNextPlayer').hidden = true; $('bShare').hidden = true; $('overHint').hidden = false; }
    $('linkbox').hidden = true; C.ui.show('over'); return;
  }
  const key = G.mode === 'daily' ? 'daily.' + C.todayStr() : 'best';
  const best = S.get(key, 0), rec = G.score > best; if (rec) S.set(key, G.score);
  const title = reason === 'done' ? 'DU ÄR SVENSK NU. GRATTIS. ELLER.' : G.right >= 15 ? 'NÄSTAN SVENSK' : G.right >= 8 ? 'PÅ VÄG. TA EN NUMMERLAPP.' : 'VÄLKOMMEN TILL KÖN';
  C.ui.setText('overTag', (G.mode === 'daily' ? 'DAGENS SVERIGE · ' : G.mode === 'challenge' ? 'UTMANING · ' : '') + title);
  C.ui.setText('overScore', String(G.score));
  let sub = (rec ? 'NYTT REKORD!' : 'Bästa: ' + best) + ' · ' + G.right + ' rätt av ' + G.i + (G.bestCombo >= 3 ? ' · combo x' + G.bestCombo : '');
  if (G.mode === 'challenge') sub += G.score > G.challengeScore ? ' · Du slog din vän (' + G.challengeScore + ')! 🏆' : ' · Din vän hade ' + G.challengeScore + '.';
  C.ui.setText('overSub', sub);
  $('bAgain').hidden = false; $('bAgain').textContent = 'IGEN'; $('bNextPlayer').hidden = true; $('bShare').hidden = false; $('overHint').hidden = false; $('linkbox').hidden = true;
  if (rec && best > 0) { C.haptics.win(); C.audio.fanfare(); }
  updateBest(); C.ui.show('over');
}
function restart() {
  if (G.mode === 'duel' && G.duel.turn === 0 && G.screen === 'over') { G.duel.turn = 1; startRun('duel', G.seed); C.ui.toast('Spelare 2: samma situationer. Kör!', 1600); return; }
  if (G.mode === 'duel') { startGame('duel'); return; }
  startGame(G.mode);
}
function goMenu() { G.screen = 'menu'; C.ui.hideAll(); C.ui.show('menu'); updateBest(); }
function updateBest() { const b = S.get('best', 0), d = S.get('daily.' + C.todayStr(), 0); C.ui.setText('bestLine', (b ? 'Bästa: ' + b : 'Inget rekord än') + (d ? ' · Dagens: ' + d : '')); }
function share() { const url = location.href.split('#')[0] + '#s=' + encodeURIComponent(G.seed) + '&t=' + G.score; C.share({ text: 'NUMMERLAPPEN 🎟️ ' + G.score + ' p, ' + G.right + ' svenska koder rätt. Samma Sverige, slå mig:', url, linkboxId: 'linkbox' }); }

function update(dt) {
  if (G.screen !== 'play') return;
  if (G.flash) { G.flash.t -= dt; if (G.flash.t <= 0) G.flash = null; }
  if (G.leaving) { G.leaving.t += dt; if (G.leaving.t > 0.5) G.leaving = null; }
  if (G.verdict) { G.verdict.t += dt; if (G.verdict.t >= G.verdict.dur) endVerdict(); return; }
  if (G.card) { G.card.enter = Math.min(1, G.card.enter + dt * 6); G.timer -= dt; if (G.timer <= 0) timeout(); }
}
function wrap(ctx, text, maxW, font) { ctx.font = font; const words = text.split(' '), lines = []; let line = ''; for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; } if (line) lines.push(line); return lines; }
function drawCard(ctx, c, x, y, alpha = 1, rot = 0) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot);
  const w = g.W - 88, h = 250;
  C.rrect(ctx, -w / 2 + 4, -h / 2 + 8, w, h, 16); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  C.rrect(ctx, -w / 2, -h / 2, w, h, 16); ctx.fillStyle = '#FFF8E7'; ctx.fill();
  ctx.fillStyle = '#FFCC33'; C.rrect(ctx, -w / 2, -h / 2, w, 34, 16); ctx.fill(); ctx.fillRect(-w / 2, -h / 2 + 18, w, 16);
  C.text(ctx, c.cat, 0, -h / 2 + 17, 15, '#1A1400', 'center', C.F.display, false);
  const lines = wrap(ctx, c.q, w - 36, '800 17px ' + C.F.ui);
  lines.slice(0, 6).forEach((ln, i) => C.text(ctx, ln, 0, -h / 2 + 62 + i * 24, 17, '#1A1400', 'center', '800 ' + C.F.ui, false));
  // punched holes like a queue ticket
  ctx.fillStyle = '#0B2A5B'; for (let k = -w / 2 + 20; k < w / 2; k += 22) { ctx.beginPath(); ctx.arc(k, h / 2 - 12, 4, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function render(ctx) {
  const W = g.W, H = g.H, cy = cardY();
  ctx.save(); g.fx.applyShake(ctx);
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0B2A5B'); gr.addColorStop(1, '#16407A'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.04)'; for (let y = 0; y < H; y += 34) ctx.fillRect(0, y, W, 1);
  if (G.screen !== 'menu') {
    const c = G.card;
    const zone = (dir, x, y, w, h, color, label, vertical) => { const f = G.flash && G.flash.dir === dir ? G.flash : null; ctx.save(); C.rrect(ctx, x, y, w, h, 12); ctx.fillStyle = f ? (f.ok ? 'rgba(98,210,111,.55)' : 'rgba(255,94,91,.6)') : 'rgba(255,255,255,.07)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = f ? (f.ok ? '#62D26F' : '#FF5E5B') : color; ctx.stroke(); if (vertical) { ctx.translate(x + w / 2, y + h / 2); ctx.rotate(-Math.PI / 2); const ls = wrap(ctx, label, h - 20, '900 13px ' + C.F.ui); ls.slice(0, 2).forEach((ln, i) => C.text(ctx, ln, 0, (i - (ls.length - 1) / 2) * 15, 13, color, 'center', '900 ' + C.F.ui, false)); } else C.text(ctx, label, x + w / 2, y + h / 2, 15, color, 'center', C.F.display, false); ctx.restore(); };
    const lLabel = c ? '⇠ ' + c.l : '', rLabel = c ? c.r + ' ⇢' : '';
    zone('left', 8, cy - 140, 44, 280, '#FFF8E7', lLabel, true);

      C.text(ctx, v.ok ? 'SVENSKT!' : (v.slow ? 'FÖR LÅNGSAM' : 'KULTURKROCK!'), W / 2, cy - h / 2 + 30, 26, '#FFF8E7', 'center', C.F.display, false);
      if (!v.ok) C.text(ctx, 'Rätt: ' + ({ left: '⇠', right: '⇢', up: '⇡ fika', down: '⇣ nummerlapp' })[v.right], W / 2, cy - h / 2 + 56, 13, '#FFF8E7', 'center', '900 ' + C.F.ui, false);
      lines.forEach((ln, i) => C.text(ctx, ln, W / 2, cy - h / 2 + (v.ok ? 60 : 80) + i * 22, 16, '#FFF8E7', 'center', '800 ' + C.F.ui, false));
      ctx.restore();
      C.text(ctx, 'tryck för nästa', W / 2, cy + h / 2 + 22, 11, '#B9C7DD', 'center', C.F.ui, false);
    }
    C.text(ctx, '♥'.repeat(Math.max(0, G.lives)) + '♡'.repeat(Math.max(0, 3 - G.lives)), 16, 28, 22, '#FF5E5B', 'left');
    C.text(ctx, String(G.score), W / 2, 34, 34, '#FFF8E7');
    if (G.combo >= 2) C.text(ctx, 'x' + G.combo, W - 20, 30, 24, '#FFCC33', 'right');
    C.text(ctx, (G.mode === 'duel' ? 'SPELARE ' + (G.duel.turn + 1) + ' · ' : '') + 'SITUATION ' + (G.i + 1) + (G.mode === 'duel' ? '/' + DUEL_N : ''), W / 2, 60, 12, '#B9C7DD', 'center', C.F.ui);
    C.text(ctx, 'MENY', 16, H - 20, 12, 'rgba(255,248,231,.5)', 'left', C.F.ui, false);
  }

}
function onTap(x, y) {

}

const g = C.mount({ ariaLabel: 'Nummerlappen spelplan', onTap, onSwipe, update, render, onKey: k => { if (k === 'Escape') { goMenu(); return true; } if ((k === ' ' || k === 'Enter') && G.screen === 'menu') { startGame(G.challengeSeed ? 'challenge' : 'free'); return true; } return false; } });

const h = C.hash();
if (h.get('s')) { G.challengeSeed = h.get('s'); G.challengeScore = parseInt(h.get('t') || '0', 10) || 0; $('challengeLine').hidden = false; C.ui.setText('challengeLine', 'Utmaning från en vän: slå ' + G.challengeScore + ' p på exakt samma situationer. BLI SVENSK startar utmaningen.'); C.ui.setText('bPlay', 'TA UTMANINGEN'); }
C.ui.bind('bPlay', () => startGame(G.challengeSeed ? 'challenge' : 'free'));
C.ui.bind('bDaily', () => startGame('daily'));
C.ui.bind('bDuel', () => startGame('duel'));
C.ui.bind('bHap', () => { C.haptics.on = !C.haptics.on; S.set('haptics', C.haptics.on); refreshToggles(); C.haptics.medium(); });

C.ui.overlayTap('over', () => { if (performance.now() > G.overReadyAt && !(G.mode === 'duel' && G.duel.turn === 0)) restart(); });
refreshToggles(); updateBest(); window.__G = G;

})();
