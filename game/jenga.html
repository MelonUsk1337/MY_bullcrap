<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Jenga-huset</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
:root{--ground:#79C4E6;--panel:rgba(18,32,58,.9);--cream:#FFF8EA;--dim:#BFD3E6;--accent:#FFB703;--accent-shadow:#A86F00;--btn-text:#2B1B00;--card:#24405E;--card-dk:#16283D;--line:#3A5A80;--how-cols:3;color-scheme:dark}
</style>
<script src="lib/matter.min.js"></script>
<script src="lib/core.js"></script>
</head>
<body>
<div id="stage"><div id="box"><div id="frame">
<div id="menu" class="ov">
  <h1 class="logo">JENGA-HUSET</h1>
  <p class="sub">Bygg huset våning för våning med riktig fysik. Knuffa tornet när det lutar. Akta jordbävningar och duvor.</p>
  <div class="how" aria-label="Så här spelar du">
    <div><b>TAP</b>släpp våningen</div>
    <div><b>⇠ ⇢</b>knuffa tornet</div>
    <div><b>⇡</b>skräm duvan</div>
  </div>
  <button class="btn" id="bPlay">BYGG</button>
  <div class="row">
    <button class="btn sec" id="bDaily">Dagens tomt</button>
    <button class="btn sec" id="bDuel">Jenga-duell · 2 spelare</button>
  </div>
  <div class="row">
    <button class="btn sec" id="bHap">Vibration: på</button>
    <button class="btn sec" id="bSnd">Ljud: på</button>
  </div>
  <p class="small" id="bestLine"></p>
  <p class="small" id="challengeLine" hidden></p>
</div>
<div id="over" class="ov" hidden>
  <p class="tag" id="overTag">HUSET RASADE</p>
  <p class="big" id="overScore">0</p>
  <p class="sub" id="overSub"></p>
  <button class="btn" id="bAgain">IGEN</button>
  <div class="row">
    <button class="btn sec" id="bShare">Utmana en vän</button>
    <button class="btn sec" id="bMenu">Meny</button>
  </div>
  <input id="linkbox" class="linkbox" hidden readonly aria-label="Utmaningslänk">
  <p class="small">Tryck var som helst för att köra igen</p>
</div>
<div id="toast" role="status"></div>
</div></div></div>
<script>
(() => {
'use strict';
const C = Core, $ = C.$;
const { Engine, Bodies, Body, Composite, Sleeping } = Matter;
const S = C.store('jenga');
C.haptics.on = S.get('haptics', true); C.audio.on = S.get('sound', true);
const COLORS = ['#FF8C69', '#FFD166', '#8EE4AF', '#7FD1F0', '#C8A2FF', '#FFA8D5', '#F4E1A1'];
const LOT_W = 190, FLOOR_H = 34;

const G = { screen: 'menu', mode: 'free', seed: '', engine: null, ground: null, blocks: [], pigeon: null, crane: null, i: 0, floors: 0, perfects: 0, score: 0,
  camY: 0, camTarget: 0, dropCooldown: 0, quake: null, quakeAt: 8, pigeonAt: 5, settled: true, lastDropAt: 0, anim: null, overReadyAt: 0,
  duel: { turn: 0, wins: [0, 0], responsible: 0 }, challengeSeed: null, challengeScore: 0, hint: { pigeon: false, shove: false }, clouds: [] };
const groundY = () => g.H - 110;

function startGame(mode) {
  G.mode = mode; G.screen = 'play'; G.anim = null;
  G.seed = mode === 'daily' ? 'daily-' + C.todayStr() : mode === 'challenge' ? G.challengeSeed : C.newSeed();
  G.engine = Engine.create({ enableSleeping: true }); G.engine.gravity.y = 1.1;
  G.ground = Bodies.rectangle(g.W / 2, groundY() + 30, LOT_W, 60, { isStatic: true, friction: 1, label: 'ground' });
  Composite.add(G.engine.world, G.ground);
  G.blocks = []; G.pigeon = null; G.i = 0; G.floors = 0; G.perfects = 0; G.score = 0; G.camY = 0; G.camTarget = 0; G.dropCooldown = 0;
  G.quake = null; G.quakeAt = 8; G.pigeonAt = 5; G.settled = true; G.hint = { pigeon: false, shove: false };
  if (mode === 'duel') G.duel.turn = 0; G.duel.responsible = 0;
  G.clouds = Array.from({ length: 6 }, (_, k) => ({ x: (k * 137) % g.W, y: 60 + (k * 91) % 300, w: 70 + (k * 37) % 60, s: 6 + (k % 3) * 4 }));
  newCrane(); C.ui.hideAll();
  C.ui.toast(mode === 'duel' ? 'Turas om. Den som får huset att rasa förlorar.' : 'Tryck för att släppa. Swipa i sidled om det lutar.', 2200);
}
function newCrane() {
  const i = G.i, r = C.rngAt(G.seed, i), a = r(), b = r();
  const w = Math.round(70 + a * 70), speed = Math.min(560, 170 + 8 * i);
  const dir = b < 0.5 ? 1 : -1;
  G.crane = { w, x: dir > 0 ? 20 : g.W - 20 - w, dir, speed, color: COLORS[i % COLORS.length], win: 2 + Math.floor((w - 70) / 30) };
}
function topBlock() { let t = null; for (const b of G.blocks) if (!t || b.position.y < t.position.y) t = b; return t; }
function towerTopY() { let y = groundY(); for (const b of G.blocks) y = Math.min(y, b.bounds.min.y); return y; }
function craneY() { return Math.max(60, towerTopY() - 210); }
function drop() {
  if (!G.crane || G.dropCooldown > 0 || G.anim) return;
  const c = G.crane, cx = c.x + c.w / 2, cy = craneY() + G.camY;
  const b = Bodies.rectangle(cx, cy, c.w, FLOOR_H, { friction: 0.9, frictionStatic: 1, restitution: 0, density: 0.004, chamfer: { radius: 3 }, label: 'block' });
  b.render_color = c.color; b.render_win = c.win; b.render_w = c.w; b.dropX = cx; b.counted = false; b.owner = G.mode === 'duel' ? G.duel.turn : 0;
  Composite.add(G.engine.world, b); G.blocks.push(b);
  for (const o of G.blocks) Sleeping.set(o, false);
  G.i++; G.dropCooldown = 0.45; G.settled = false; G.lastDropAt = g.t;
  C.haptics.tap(); C.audio.pop();
  if (G.mode === 'duel') { G.duel.responsible = G.duel.turn; G.duel.turn ^= 1; }
  newCrane();
}
function shove(sgn) {
  if (!G.blocks.length || G.anim) return;
  for (const b of G.blocks) { Sleeping.set(b, false); Body.setVelocity(b, { x: b.velocity.x + sgn * 1.6, y: b.velocity.y - 0.2 }); }
  g.fx.shake = 5; C.haptics.medium(); C.audio.whoosh();
  g.fx.text(g.W / 2 + sgn * 60, towerTopY() - G.camY - 20, sgn > 0 ? 'KNUFF ⇢' : '⇠ KNUFF', '#FFF8EA', 18, 0.6);
}
function scarePigeon() {
  if (!G.pigeon) { return; }
  const p = G.pigeon; Composite.remove(G.engine.world, p.body); G.pigeon = null;
  G.score += 5; g.fx.text(p.body.position.x, p.body.position.y - G.camY - 30, 'FLYG! +5', '#FFF8EA', 18);
  g.fx.burst(p.body.position.x, p.body.position.y - G.camY, 10, ['#DDD', '#999'], 160, 0.6, 200);
  G.flyaway = { x: p.body.position.x, y: p.body.position.y - G.camY, t: 0 };
  C.haptics.light(); C.audio.whoosh();
}
function landPigeon() {
  const t = topBlock(); if (!t) return;
  const side = C.rngAt(G.seed + '-pig', G.i)() < 0.5 ? -1 : 1;
  const x = t.position.x + side * (t.bounds.max.x - t.bounds.min.x) / 2 * 0.85, y = t.bounds.min.y - 60;
  const body = Bodies.circle(x, y, 9, { density: 0.02, friction: 1, restitution: 0, label: 'pigeon' });
  Composite.add(G.engine.world, body); G.pigeon = { body, since: g.t };
  if (!G.hint.pigeon) { G.hint.pigeon = true; C.ui.toast('DUVA! Den tynger ena sidan. Swipa upp ⇡ för att skrämma bort den.', 2600); }
  C.haptics.light(); C.audio.ding();
}
function startQuake() {
  G.quake = { t: 0, dur: 2.2 }; G.quakeAt += 8;
  g.fx.text(g.W / 2, 140, 'JORDBÄVNING!', '#FF4B3E', 34, 1.4); C.haptics.big(); C.audio.crunch();
  for (const b of G.blocks) Sleeping.set(b, false);
}
function collapse(b) {
  if (G.anim) return;
  g.fx.shake = 22; C.haptics.fail(); C.audio.crunch();
  g.fx.burst(b.position.x, b.position.y - G.camY, 30, [b.render_color || '#FFF', '#8B5A2B'], 300, 1);
  G.anim = { t: 0, dur: 1.0, after: showOver };
}
function showOver() {
  G.screen = 'over'; G.overReadyAt = performance.now() + 500;
  if (G.mode === 'duel') {
    const loser = G.duel.responsible, winner = 1 - loser; G.duel.wins[winner]++;
    C.ui.setText('overTag', 'SPELARE ' + (winner + 1) + ' VANN'); C.ui.setText('overScore', G.duel.wins[0] + ' – ' + G.duel.wins[1]);
    C.ui.setText('overSub', 'Spelare ' + (loser + 1) + ' fick huset att rasa vid ' + G.floors + ' våningar.'); $('bShare').hidden = true; $('bAgain').textContent = 'NÄSTA RUNDA';
    C.haptics.win(); C.audio.fanfare();
  } else {
    const key = G.mode === 'daily' ? 'daily.' + C.todayStr() : 'best';
    const best = S.get(key, 0), rec = G.score > best; if (rec) S.set(key, G.score);
    C.ui.setText('overTag', (G.mode === 'daily' ? 'DAGENS TOMT · ' : G.mode === 'challenge' ? 'UTMANING · ' : '') + 'HUSET RASADE');
    C.ui.setText('overScore', String(G.score));
    let sub = (rec ? 'NYTT REKORD!' : 'Bästa: ' + best) + ' · ' + G.floors + ' våningar · ' + G.perfects + ' perfekta';
    if (G.mode === 'challenge') sub += G.score > G.challengeScore ? ' · Du slog din vän (' + G.challengeScore + ')! 🏆' : ' · Din vän hade ' + G.challengeScore + '.';
    C.ui.setText('overSub', sub); $('bShare').hidden = false; $('bAgain').textContent = 'IGEN';
    if (rec && best > 0) { C.haptics.win(); C.audio.fanfare(); }
    updateBest();
  }
  $('linkbox').hidden = true; C.ui.show('over');
}
function restart() { startGame(G.mode); }
function goMenu() { G.screen = 'menu'; C.ui.hideAll(); C.ui.show('menu'); updateBest(); }
function updateBest() { const b = S.get('best', 0), d = S.get('daily.' + C.todayStr(), 0); C.ui.setText('bestLine', (b ? 'Bästa: ' + b : 'Inget rekord än') + (d ? ' · Dagens: ' + d : '')); }
function share() { const url = location.href.split('#')[0] + '#s=' + encodeURIComponent(G.seed) + '&t=' + G.score; C.share({ text: 'JENGA-HUSET 🏠 ' + G.floors + ' våningar, ' + G.score + ' p. Samma tomt, slå mig:', url, linkboxId: 'linkbox' }); }

function update(dt) {
  if (G.screen !== 'play') return;
  if (G.anim) { G.anim.t += dt; Engine.update(G.engine, 1000 / 60); if (G.anim.t >= G.anim.dur) { const a = G.anim; G.anim = null; a.after(); } return; }
  if (G.dropCooldown > 0) G.dropCooldown -= dt;
  const c = G.crane;
  if (c) { c.x += c.dir * c.speed * dt; const minX = 12, maxX = g.W - 12 - c.w; if (c.x < minX) { c.x = minX; c.dir = 1; } else if (c.x > maxX) { c.x = maxX; c.dir = -1; } }
  if (G.quake) {
    G.quake.t += dt; const k = G.quake.t / G.quake.dur, amp = 5 * Math.sin(k * Math.PI);
    Body.setPosition(G.ground, { x: g.W / 2 + Math.sin(G.quake.t * 28) * amp, y: groundY() + 30 });
    for (const b of G.blocks) if (b.isSleeping) Sleeping.set(b, false);
    g.fx.shake = Math.max(g.fx.shake, 4 + amp);
    if (G.quake.t >= G.quake.dur) { G.quake = null; Body.setPosition(G.ground, { x: g.W / 2, y: groundY() + 30 }); }
  }
  Engine.update(G.engine, 1000 / 60);
  // settle detection and scoring
  let moving = false;
  for (const b of G.blocks) { if (!b.isSleeping && (b.speed > 0.12 || b.angularSpeed > 0.01)) moving = true; }
  if (!moving && !G.settled && g.t - G.lastDropAt > 0.35) {
    G.settled = true;
    for (const b of G.blocks) if (!b.counted) {
      b.counted = true; G.floors++;
      let pts = 10;
      const under = G.blocks.filter(o => o !== b && o.position.y > b.position.y).sort((p, q) => p.position.y - q.position.y)[0];
      const ref = under ? under.position.x : g.W / 2;
      if (Math.abs(b.position.x - ref) <= 6 && Math.abs(b.angle) < 0.05) { pts += 20; G.perfects++; g.fx.text(b.position.x, b.position.y - G.camY - 30, 'PERFEKT! +30', '#FFB703', 24); g.fx.ring(b.position.x, b.position.y - G.camY, '#FFB703'); C.haptics.success(G.perfects); C.audio.blip(Math.min(G.perfects, 8)); }
      else { g.fx.text(b.position.x, b.position.y - G.camY - 30, '+10', '#FFF8EA', 18, 0.6); C.haptics.light(); C.audio.thud(); }
      G.score += pts;
    }
    if (G.floors >= G.pigeonAt && !G.pigeon && !G.quake) { G.pigeonAt += 4; landPigeon(); }
    if (G.floors >= G.quakeAt) startQuake();
  }
  // collapse
  for (const b of G.blocks) if (b.position.y > groundY() + 90 || Math.abs(b.position.x - g.W / 2) > g.W) { collapse(b); break; }
  if (G.pigeon && G.pigeon.body.position.y > groundY() + 60) { Composite.remove(G.engine.world, G.pigeon.body); G.pigeon = null; }
  // tilt hint
  const t = topBlock();
  if (t && !G.hint.shove && Math.abs(t.position.x - g.W / 2) > 40 && G.floors >= 3) { G.hint.shove = true; C.ui.toast('Huset lutar! Swipa åt andra hållet för att knuffa tillbaka.', 2400); }
  // camera
  G.camTarget = Math.min(0, towerTopY() - 300);
  G.camY += (G.camTarget - G.camY) * Math.min(1, dt * 4);
  if (G.flyaway) { G.flyaway.t += dt; if (G.flyaway.t > 1) G.flyaway = null; }
  for (const cl of G.clouds) { cl.x += cl.s * dt; if (cl.x > g.W + 60) cl.x = -80; }
}
function drawBlock(ctx, b) {
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  const w = b.bounds.max.x - b.bounds.min.x, h = FLOOR_H;
  const bw = b.render_w || Math.round(w);
  C.rrect(ctx, -bw / 2, -h / 2, bw, h, 4); ctx.fillStyle = b.render_color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(40,20,0,.35)'; ctx.stroke();
  ctx.fillStyle = 'rgba(30,50,90,.75)';
  const n = b.render_win || 2, gap = bw / (n + 1);
  for (let k = 1; k <= n; k++) { ctx.fillRect(-bw / 2 + gap * k - 6, -8, 12, 14); }
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-bw / 2 + 2, -h / 2 + 2, bw - 4, 3);
  ctx.restore();
}
function render(ctx) {
  const W = g.W, H = g.H;
  ctx.save(); g.fx.applyShake(ctx);
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#5FB3DD'); gr.addColorStop(1, '#BFE8F7');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  if (G.screen !== 'menu') {
    for (const cl of G.clouds) { const y = cl.y - G.camY * 0.2; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(cl.x, y, cl.w / 2, 14, 0, 0, Math.PI * 2); ctx.ellipse(cl.x - cl.w * 0.25, y + 4, cl.w * 0.28, 12, 0, 0, Math.PI * 2); ctx.ellipse(cl.x + cl.w * 0.25, y + 4, cl.w * 0.3, 13, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.save(); ctx.translate(0, -G.camY);
    // ground lot
    ctx.fillStyle = '#5B8C3A'; ctx.fillRect(0, groundY() + 70, W, H);
    ctx.fillStyle = '#8B5A2B'; ctx.fillRect(G.ground.position.x - LOT_W / 2, groundY(), LOT_W, 60);
    ctx.fillStyle = '#6FAE4C'; ctx.fillRect(G.ground.position.x - LOT_W / 2, groundY(), LOT_W, 10);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, groundY() + 60, W, 10);
    for (const b of G.blocks) drawBlock(ctx, b);
    if (G.pigeon) { const p = G.pigeon.body.position; ctx.fillStyle = '#B9B9C9'; ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#FFB703'; ctx.beginPath(); ctx.moveTo(p.x + 9, p.y - 2); ctx.lineTo(p.x + 16, p.y); ctx.lineTo(p.x + 9, p.y + 2); ctx.fill(); ctx.fillStyle = '#1B1430'; ctx.beginPath(); ctx.arc(p.x + 4, p.y - 3, 2, 0, Math.PI * 2); ctx.fill(); C.text(ctx, '⇡', p.x, p.y - 28, 22, '#FFF8EA'); }
    ctx.restore();
    if (G.flyaway) { const f = G.flyaway, k = f.t; C.emoji(ctx, '🕊️', f.x + k * 120, f.y - k * 220, 28); }
    // crane
    if (G.crane && !G.anim) {
      const c = G.crane, cy = craneY();
      ctx.fillStyle = '#3A3A3A'; ctx.fillRect(0, 22, W, 8);
      ctx.strokeStyle = '#3A3A3A'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(c.x + c.w / 2, 30); ctx.lineTo(c.x + c.w / 2, cy - FLOOR_H / 2); ctx.stroke();
      ctx.fillStyle = '#FFB703'; ctx.fillRect(c.x + c.w / 2 - 10, 26, 20, 10);
      const fake = { position: { x: c.x + c.w / 2, y: cy }, angle: 0, bounds: { min: { x: c.x }, max: { x: c.x + c.w } }, render_w: c.w, render_color: c.color, render_win: c.win };
      drawBlock(ctx, fake);
      // drop guide
      ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#FFF8EA'; ctx.fillRect(c.x, cy + FLOOR_H / 2, c.w, towerTopY() - G.camY - cy - FLOOR_H / 2); ctx.restore();
    }
    // HUD
    const dark = '#16283D';
    if (G.mode === 'duel') { const col = G.duel.turn === 0 ? '#FFB703' : '#FF4B3E'; ctx.fillStyle = col; ctx.fillRect(0, 0, W, 6); C.text(ctx, 'SPELARE ' + (G.duel.turn + 1), W / 2, 56, 30, col); C.text(ctx, G.duel.wins[0] + ' – ' + G.duel.wins[1], W - 16, 54, 16, '#FFF8EA', 'right'); }
    else { C.text(ctx, String(G.score), W / 2, 60, 40, '#FFF8EA'); C.text(ctx, G.mode === 'challenge' ? 'ATT SLÅ ' + G.challengeScore : 'BÄST ' + S.get(G.mode === 'daily' ? 'daily.' + C.todayStr() : 'best', 0), W / 2, 90, 12, dark, 'center', C.F.ui, false); }
    C.text(ctx, G.floors + ' VÅN', 16, 56, 20, '#FFF8EA', 'left');
    if (G.floors >= G.quakeAt - 1 && !G.quake) C.text(ctx, 'JORDBÄVNING SNART', 16, 82, 11, dark, 'left', C.F.ui, false);
    C.text(ctx, 'MENY', 16, H - 20, 12, dark, 'left', C.F.ui, false);
  }
  g.fx.draw(ctx);
  ctx.restore();
}
function onTap(x, y) {
  if (G.screen === 'play') { if (x < 70 && y > g.H - 40) { goMenu(); return; } drop(); }
  else if (G.screen === 'over' && performance.now() > G.overReadyAt) restart();
}
function onSwipe(dir) {
  if (G.screen !== 'play' || G.anim) return;
  if (dir === 'left') shove(-1); else if (dir === 'right') shove(1); else if (dir === 'up') scarePigeon(); else if (dir === 'down') drop();
}
const g = C.mount({ ariaLabel: 'Jenga-huset spelplan', onTap, onSwipe, update, render, onKey: k => { if (k === 'Escape') { goMenu(); return true; } if ((k === ' ' || k === 'Enter') && G.screen === 'menu') { startGame(G.challengeSeed ? 'challenge' : 'free'); return true; } return false; } });
function refreshToggles() { C.ui.setText('bHap', 'Vibration: ' + (C.haptics.on ? 'på' : 'av')); C.ui.setText('bSnd', 'Ljud: ' + (C.audio.on ? 'på' : 'av')); }
const h = C.hash();
if (h.get('s')) { G.challengeSeed = h.get('s'); G.challengeScore = parseInt(h.get('t') || '0', 10) || 0; $('challengeLine').hidden = false; C.ui.setText('challengeLine', 'Utmaning från en vän: slå ' + G.challengeScore + ' p på exakt samma tomt. BYGG startar utmaningen.'); C.ui.setText('bPlay', 'TA UTMANINGEN'); }
C.ui.bind('bPlay', () => startGame(G.challengeSeed ? 'challenge' : 'free'));
C.ui.bind('bDaily', () => startGame('daily'));
C.ui.bind('bDuel', () => { G.duel.wins = [0, 0]; startGame('duel'); });
C.ui.bind('bHap', () => { C.haptics.on = !C.haptics.on; S.set('haptics', C.haptics.on); refreshToggles(); C.haptics.medium(); });
C.ui.bind('bSnd', () => { C.audio.on = !C.audio.on; S.set('sound', C.audio.on); refreshToggles(); C.audio.blip(1); });
C.ui.bind('bAgain', restart); C.ui.bind('bShare', share); C.ui.bind('bMenu', goMenu);
C.ui.overlayTap('over', () => { if (performance.now() > G.overReadyAt) restart(); });
refreshToggles(); updateBest();
const boot = () => g.start();
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
</script>
</body>
</html>
