<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sysslor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
:root{--ground:#1F2A22;--panel:rgba(20,28,22,.9);--cream:#FFF8EC;--dim:#B8C4B4;--accent:#7ED957;--accent-shadow:#3E8E2E;--btn-text:#0F2A12;--card:#2E3D31;--card-dk:#1F2A22;--line:#4B5E4E;--how-cols:3;color-scheme:dark}
.who{display:flex;gap:8px;width:100%;max-width:360px}
.who label{flex:1;display:flex;flex-direction:column;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding-block:8px;padding-inline:10px;cursor:pointer;text-align:left}
.who label.active{border-color:var(--accent)}
.who span{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.who input{font:800 15px Nunito,system-ui,sans-serif;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--cream);width:100%;padding:2px 0;outline:none}
.chores{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:360px}
.chore{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding-block:12px;padding-inline:8px;color:var(--cream);cursor:pointer;font-family:Nunito,system-ui,sans-serif;box-shadow:0 5px 0 var(--card-dk);transition:transform .05s}
.chore:active{transform:translateY(3px);box-shadow:0 2px 0 var(--card-dk)}
.chore.done{border-color:var(--accent)}
.chore .ce{font-size:34px;line-height:1}
.chore .cn{font-weight:900;font-size:14px}
.chore .cs{font-family:"Lilita One",Impact,system-ui,sans-serif;font-size:18px;color:#FFD166;letter-spacing:2px}
.chore .cb{font-size:11px;font-weight:800;color:var(--dim)}
.score-line{font-weight:900;font-size:14px;color:var(--cream);margin:0}
.stars{font-family:"Lilita One",Impact,system-ui,sans-serif;font-size:56px;line-height:1;margin:0;color:#FFD166;letter-spacing:4px}
</style>
<script src="lib/core.js"></script>
</head>
<body>
<div id="stage"><div id="box"><div id="frame">
<div id="menu" class="ov">
  <h1 class="logo">SYSSLOR</h1>
  <p class="sub">Fyra tråkiga sysslor, fyra snabba spel. Samma gräsmatta, ruta, tvätthög och golv för hela hushållet i dag. Vem städar bäst?</p>
  <div class="who" id="who">
    <label id="who0" class="active"><span>Spelare 1</span><input id="name0" maxlength="14" aria-label="Namn spelare 1"></label>
    <label id="who1"><span>Spelare 2</span><input id="name1" maxlength="14" aria-label="Namn spelare 2"></label>
  </div>
  <div id="choreList" class="chores"></div>
  <p class="score-line" id="dayLine"></p>
  <p class="small" id="streakLine"></p>
  <div class="row">
    <button class="btn sec" id="bHap">Vibration: på</button>
    <button class="btn sec" id="bSnd">Ljud: på</button>
  </div>
</div>
<div id="intro" class="ov" hidden>
  <p class="tag" id="introTag">SYSSLA</p>
  <h1 class="logo" id="introTitle" style="font-size:44px"></h1>
  <p class="sub" id="introHint"></p>
  <div class="how" id="introHow"></div>
  <button class="btn" id="bStart">KÖR</button>
  <button class="btn sec" id="bIntroBack">Tillbaka</button>
</div>
<div id="over" class="ov" hidden>
  <p class="tag" id="overTag"></p>
  <p class="stars" id="overStars">★★★</p>
  <p class="big" id="overScore" style="font-size:44px">0</p>
  <p class="sub" id="overSub"></p>
  <button class="btn" id="bNext">NÄSTA SYSSLA</button>
  <div class="row">
    <button class="btn sec" id="bAgain">Igen</button>
    <button class="btn sec" id="bShare">Utmana</button>
    <button class="btn sec" id="bMenu">Till huset</button>
  </div>
  <input id="linkbox" class="linkbox" hidden readonly aria-label="Utmaningslänk">
</div>
<div id="toast" role="status"></div>
</div></div></div>
<script>
(() => {
'use strict';
const C = Core, $ = C.$;
const S = C.store('sysslor');
C.haptics.on = S.get('haptics', true); C.audio.on = S.get('sound', true);
const CHORES = [
  { id: 'grass', name: 'Klippa gräset', emoji: '🌱', tag: 'TRÄDGÅRDEN', hint: 'Swipa för att styra klipparen. Klipp allt innan grannen klagar. Stenar stoppar, blommor får inte klippas, mullvaden gräver upp.', how: [['⇠⇡⇢⇣', 'styr klipparen'], ['🪨 💩', 'akta'], ['🐹', 'kör över mullvaden']] },
  { id: 'window', name: 'Torka fönster', emoji: '🪟', tag: 'VARDAGSRUMMET', hint: 'Dra fingret över rutan tills den är blank innan regnet kommer. Fåglar bajsar på rutan, tryck på dem innan de hinner. Flugor: tryck.', how: [['DRA', 'torka rutan'], ['🐦', 'tryck innan den bajsar'], ['🪰', 'tryck på flugan']] },
  { id: 'laundry', name: 'Sortera tvätt', emoji: '🧺', tag: 'TVÄTTSTUGAN', hint: 'Swipa plagget till rätt hög. Trasigt går alltid i soporna, fintvätt alltid upp. Ljusrosa är INTE vitt.', how: [['⇠', 'vitt'], ['⇢', 'kulört'], ['⇡', 'fintvätt'], ['⇣', 'trasigt']] },
  { id: 'vacuum', name: 'Dammsuga', emoji: '🧹', tag: 'VARDAGSRUMMET', hint: 'Swipa för att styra dammsugaren och sug upp allt damm. Katten klöser om du kör på den. Lego fastnar i slangen.', how: [['⇠⇡⇢⇣', 'styr dammsugaren'], ['🐈', 'kör inte på katten'], ['🧱', 'lego fastnar']] },
];
const G = { screen: 'menu', chore: null, game: null, seed: '', who: S.get('who', 0), names: S.get('names', ['', '']), overReadyAt: 0, challenge: null };
const today = () => C.todayStr();
const dayKey = () => 'day.' + today();
const dayData = () => S.get(dayKey(), {});
const nameOf = i => (G.names[i] || '').trim() || 'Spelare ' + (i + 1);
function saveResult(choreId, score, stars) {
  const d = dayData(); const p = d['p' + G.who] || (d['p' + G.who] = {});
  const prev = p[choreId];
  if (!prev || prev.score < score) p[choreId] = { score, stars };
  S.set(dayKey(), d);
  const done = CHORES.every(c => p[c.id] && p[c.id].stars >= 1);
  if (done) { const sk = 'streak.p' + G.who, st = S.get(sk, { count: 0, last: '' }); if (st.last !== today()) { const y = new Date(); y.setDate(y.getDate() - 1); const ystr = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0'); st.count = st.last === ystr ? st.count + 1 : 1; st.last = today(); S.set(sk, st); } }
  return done;
}
function renderHub() {
  const d = dayData(), p = d['p' + G.who] || {};
  const list = $('choreList'); list.innerHTML = '';
  for (const c of CHORES) {
    const r = p[c.id]; const b = document.createElement('button'); b.className = 'chore' + (r && r.stars >= 1 ? ' done' : ''); b.dataset.id = c.id;
    b.innerHTML = '<span class="ce">' + c.emoji + '</span><span class="cn">' + c.name + '</span><span class="cs">' + (r ? '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars) : '☆☆☆') + '</span><span class="cb">' + (r ? r.score + ' p' : 'inte gjord') + '</span>';
    b.addEventListener('click', () => { C.audio.unlock(); C.haptics.tap(); openIntro(c.id); });
    list.appendChild(b);
  }
  const tot = i => { const q = d['p' + i] || {}; return CHORES.reduce((a, c) => a + (q[c.id] ? q[c.id].score : 0), 0); };
  $('dayLine').textContent = 'I dag: ' + nameOf(0) + ' ' + tot(0) + ' p · ' + nameOf(1) + ' ' + tot(1) + ' p' + (tot(0) !== tot(1) ? ' · ' + (tot(0) > tot(1) ? nameOf(0) : nameOf(1)) + ' leder' : '');
  const st = S.get('streak.p' + G.who, { count: 0, last: '' });
  const allDone = CHORES.every(c => p[c.id] && p[c.id].stars >= 1);
  $('streakLine').textContent = (allDone ? 'HELA HUSET RENT I DAG! 🏠✨ ' : '') + (st.count ? 'Städ-streak: ' + st.count + ' dag' + (st.count > 1 ? 'ar' : '') : 'Gör alla fyra sysslor i dag för att starta en streak.');
  $('who0').classList.toggle('active', G.who === 0); $('who1').classList.toggle('active', G.who === 1);
}
function openIntro(id) {
  const c = CHORES.find(x => x.id === id); G.chore = c;
  $('introTag').textContent = c.tag; $('introTitle').textContent = c.name.toUpperCase(); $('introHint').textContent = c.hint;
  const how = $('introHow'); how.innerHTML = ''; how.style.setProperty('--how-cols', String(c.how.length));
  for (const [gl, lb] of c.how) { const d = document.createElement('div'); d.innerHTML = '<b>' + gl + '</b>' + lb; how.appendChild(d); }
  C.ui.hideAll(); C.ui.show('intro');
}
function startChore() {
  const c = G.chore; G.seed = (G.challenge && G.challenge.chore === c.id) ? G.challenge.seed : 'day-' + today() + '-' + c.id;
  G.screen = 'play'; C.ui.hideAll();
  G.game = c.id === 'grass' ? new Coverage('grass') : c.id === 'vacuum' ? new Coverage('vacuum') : c.id === 'window' ? new WindowGame() : new Laundry();
  G.game.start();
}
function finishChore(res) {
  // res: {score, stars, lines:[]}
  G.screen = 'over'; G.overReadyAt = performance.now() + 500;
  const allDone = saveResult(G.chore.id, res.score, res.stars);
  $('overTag').textContent = G.chore.name.toUpperCase() + (res.stars >= 1 ? ' · KLART' : ' · INTE KLART');
  $('overStars').textContent = '★'.repeat(res.stars) + '☆'.repeat(3 - res.stars);
  $('overScore').textContent = res.score + ' p';
  $('overSub').textContent = res.lines.join(' · ') + (allDone ? ' · HELA HUSET RENT! 🏠✨' : '');
  const d = dayData(), p = d['p' + G.who] || {}; const next = CHORES.find(c => !(p[c.id] && p[c.id].stars >= 1));
  $('bNext').hidden = !next; if (next) $('bNext').textContent = 'NÄSTA: ' + next.name.toUpperCase();
  $('linkbox').hidden = true;
  if (res.stars >= 1) { C.haptics.win(); C.audio.fanfare(); } else { C.haptics.fail(); C.audio.buzz(); }
  C.ui.show('over');
}
function goMenu() { G.screen = 'menu'; G.game = null; C.ui.hideAll(); renderHub(); C.ui.show('menu'); }
function share() { const url = location.href.split('#')[0] + '#c=' + G.chore.id + '&s=' + encodeURIComponent(G.seed) + '&t=' + ($('overScore').textContent.replace(/\D/g, '')); C.share({ text: 'SYSSLOR 🏠 ' + nameOf(G.who) + ' fick ' + $('overScore').textContent + ' på "' + G.chore.name + '". Samma ' + G.chore.name.toLowerCase() + ', slå det:', url, linkboxId: 'linkbox' }); }

// ================================================================ Coverage engine (grass + vacuum)
const DIRV = { left: { x: -1, y: 0 }, right: { x: 1, y: 0 }, up: { x: 0, y: -1 }, down: { x: 0, y: 1 } };
class Coverage {
  constructor(kind) { this.kind = kind; }
  start() {
    const cs = 36, cols = 10; this.cs = cs; this.cols = cols; this.ox = (g.W - cols * cs) / 2; this.oy = 96;
    this.rows = Math.max(10, Math.floor((g.H - this.oy - 66) / cs));
    this.cells = new Array(cols * this.rows).fill(0); // 0 todo, 1 done, 2 block, 3 flower, 4 hazard(poop/lego)
    const r = C.rngStream(G.seed);
    const free = (x, y) => this.get(x, y) === 0 && !(x === 0 && y === this.rows - 1) && !(x === 1 && y === this.rows - 1) && !(x === 0 && y === this.rows - 2);
    if (this.kind === 'grass') {
      for (let n = 0; n < 9; n++) { const x = Math.floor(r() * cols), y = Math.floor(r() * this.rows); if (free(x, y)) this.cells[this.idx(x, y)] = 2; }
      for (let n = 0; n < 2; n++) { const x = Math.floor(r() * (cols - 2)), y = Math.floor(r() * (this.rows - 2)); for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) if (free(x + dx, y + dy)) this.cells[this.idx(x + dx, y + dy)] = 3; }
      for (let n = 0; n < 3; n++) { const x = Math.floor(r() * cols), y = Math.floor(r() * this.rows); if (free(x, y)) this.cells[this.idx(x, y)] = 4; }
      this.time = 60; this.label = 'GRANNEN KLAGAR OM'; this.moleAt = 15; this.mole = null;
    } else {
      this.furn = [];
      const shapes = [[3, 2, 'SOFFA'], [2, 3, 'BOKHYLLA'], [2, 2, 'BORD'], [3, 1, 'TV-BÄNK']];
      for (const [w, h, name] of shapes) { for (let tries = 0; tries < 20; tries++) { const x = Math.floor(r() * (cols - w)), y = Math.floor(r() * (this.rows - h)); let ok = true; for (let dx = 0; dx < w; dx++) for (let dy = 0; dy < h; dy++) if (!free(x + dx, y + dy)) ok = false; if (ok) { for (let dx = 0; dx < w; dx++) for (let dy = 0; dy < h; dy++) this.cells[this.idx(x + dx, y + dy)] = 2; this.furn.push({ x, y, w, h, name }); break; } } }
      for (let n = 0; n < 7; n++) { const x = Math.floor(r() * cols), y = Math.floor(r() * this.rows); if (free(x, y)) this.cells[this.idx(x, y)] = 4; }
      this.cat = { x: cols - 1, y: 0, t: 0, flee: 0 }; this.time = 60; this.label = 'KATTEN VILL SOVA OM';
      this.suck = [];
    }
    this.total = this.cells.filter(c => c === 0 || c === 4).length; this.done = 0;
    this.p = { x: 0, y: this.rows - 1, dir: DIRV.right, next: null, prog: 0, stunned: 0, stopped: true, inv: 0 };
    this.stepT = 0.16; this.lives = 3; this.score = 0; this.combo = 0; this.smear = 0; this.tickT = 0; this.over = false; this.t = 0; this.dotSeed = C.rngStream(G.seed + 'dots');
    this.dots = []; for (let i = 0; i < this.cells.length; i++) { const arr = []; for (let k = 0; k < 7; k++) arr.push([this.dotSeed() * 32 + 2, this.dotSeed() * 32 + 2, 1 + this.dotSeed() * 2]); this.dots.push(arr); }
    C.ui.toast(this.kind === 'grass' ? 'Swipa åt något håll för att börja klippa.' : 'Swipa åt något håll för att börja suga.', 2000);
  }
  idx(x, y) { return y * this.cols + x; }
  get(x, y) { if (x < 0 || y < 0 || x >= this.cols || y >= this.rows) return 2; return this.cells[this.idx(x, y)]; }
  setDir(dir) { if (this.over) return; this.p.next = DIRV[dir]; if (this.p.stopped) { this.p.stopped = false; this.p.prog = 0.99; } }
  step() {
    const p = this.p; if (p.next) { p.dir = p.next; p.next = null; }
    const nx = p.x + p.dir.x, ny = p.y + p.dir.y, c = this.get(nx, ny);
    if (c === 2) { p.stopped = true; C.haptics.light(); C.audio.thud(); if (this.kind === 'grass') { g.fx.text(this.cx(p.x), this.cy(p.y) - 30, 'STOPP', '#FFF8EC', 16, 0.5); } return; }
    p.x = nx; p.y = ny; this.enter(nx, ny, c);
  }
  cx(x) { return this.ox + (x + 0.5) * this.cs; }
  cy(y) { return this.oy + (y + 0.5) * this.cs; }
  enter(x, y, c) {
    const i = this.idx(x, y), px = this.cx(x), py = this.cy(y);
    if (c === 0) { this.cells[i] = 1; this.done++; this.combo++; const pts = 10 + Math.min(this.combo, 20); this.score += pts; if (g.t - this.tickT > 0.09) { this.tickT = g.t; C.haptics.tick(); C.audio.tick(); }
      if (this.kind === 'grass') g.fx.burst(px, py, 3, ['#A5E07A', '#7CCB5E'], 90, 0.4, 250); else for (let k = 0; k < 4; k++) this.suck.push({ x: px + (Math.random() - 0.5) * 26, y: py + (Math.random() - 0.5) * 26, t: 0 }); }
    else if (c === 3) { this.cells[i] = 1; this.lives--; this.combo = 0; g.fx.text(px, py - 30, 'BLOMMORNA!', '#FF6B6B', 22, 1.2); g.fx.burst(px, py, 12, ['#FF6B9A', '#FFD166'], 200, 0.7); g.fx.shake = 10; C.haptics.fail(); C.audio.buzz(); if (this.lives <= 0) this.end('lives'); }
    else if (c === 4) { this.cells[i] = 1; this.done++; this.combo = 0;
      if (this.kind === 'grass') { this.smear = 2.5; g.fx.text(px, py - 30, 'BLÄ! 💩', '#C89B3C', 24, 1.2); g.fx.shake = 8; C.haptics.medium(); C.audio.splash(); }
      else { this.p.stunned = 1.0; g.fx.text(px, py - 30, 'AJ! LEGO FASTNADE', '#FF6B6B', 18, 1.2); g.fx.shake = 8; C.haptics.medium(); C.audio.crunch(); } }
    if (this.kind === 'grass' && this.mole && this.mole.up && this.mole.x === x && this.mole.y === y) { this.score += 50; g.fx.text(px, py - 40, 'MULLVAD! +50', '#FFD166', 24, 1.2); g.fx.burst(px, py, 14, ['#8B5A2B', '#FFD166'], 220, 0.7); this.mole = null; C.haptics.success(3); C.audio.sparkle(); }
    if (this.kind === 'vacuum' && this.cat.x === x && this.cat.y === y) this.catHit();
    if (this.done >= this.total) this.end('done');
  }
  catHit() { if (this.p.inv > 0) return; this.lives--; this.p.inv = 1.2; g.fx.text(this.cx(this.cat.x), this.cy(this.cat.y) - 30, 'KLÖS!', '#FF6B6B', 26, 1.2); g.fx.shake = 12; C.haptics.fail(); C.audio.meow(); this.catFlee(); if (this.lives <= 0) this.end('lives'); }
  catFlee() { let best = null, bd = -1; for (let n = 0; n < 30; n++) { const x = Math.floor(Math.random() * this.cols), y = Math.floor(Math.random() * this.rows); if (this.get(x, y) === 2) continue; const d = Math.abs(x - this.p.x) + Math.abs(y - this.p.y); if (d > bd) { bd = d; best = { x, y }; } } if (best) { this.cat.x = best.x; this.cat.y = best.y; } this.cat.flee = 1; }
  update(dt) {
    if (this.over) return; this.t += dt; this.time -= dt;
    if (this.time <= 0) { this.time = 0; this.end('time'); return; }
    const p = this.p;
    if (p.inv > 0) p.inv -= dt; if (this.smear > 0) this.smear -= dt;
    if (p.stunned > 0) p.stunned -= dt;
    else if (!p.stopped) { p.prog += dt / this.stepT; while (p.prog >= 1) { p.prog -= 1; this.step(); if (p.stopped || p.stunned > 0 || this.over) { p.prog = 0; break; } } }
    if (this.kind === 'grass') {
      if (this.t >= this.moleAt && !this.mole) { this.moleAt += 12; let x, y; for (let n = 0; n < 30; n++) { x = Math.floor(Math.random() * this.cols); y = Math.floor(Math.random() * this.rows); if (this.get(x, y) === 1 && (Math.abs(x - p.x) + Math.abs(y - p.y)) > 4) break; } if (this.get(x, y) === 1) { this.mole = { x, y, t: 0, up: true }; for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { const c = this.get(x + dx, y + dy); if (c === 1) { this.cells[this.idx(x + dx, y + dy)] = 0; this.done--; } } g.fx.text(this.cx(x), this.cy(y) - 30, 'MULLVAD!', '#FFD166', 20, 1); C.haptics.medium(); C.audio.pop(); } }
      if (this.mole) { this.mole.t += dt; if (this.mole.t > 3) this.mole = null; }
    } else {
      const cat = this.cat; cat.t += dt;
      if (cat.flee > 0) cat.flee -= dt;
      if (cat.t > (cat.flee > 0 ? 0.25 : 0.7)) { cat.t = 0; const dirs = Object.values(DIRV); const d = dirs[Math.floor(Math.random() * 4)]; const nx = cat.x + d.x, ny = cat.y + d.y; if (this.get(nx, ny) !== 2) { cat.x = nx; cat.y = ny; if (cat.x === p.x && cat.y === p.y) this.catHit(); } }
      for (const s of this.suck) s.t += dt * 4; this.suck = this.suck.filter(s => s.t < 1);
    }
  }
  end(reason) {
    this.over = true;
    const pct = Math.round(this.done / this.total * 100);
    let stars = pct >= 98 ? 3 : pct >= 90 ? 2 : pct >= 75 ? 1 : 0;
    if (reason === 'lives') stars = Math.min(stars, 1);
    const bonus = reason === 'done' ? Math.round(this.time) * 5 : 0; this.score += bonus;
    const lines = [pct + ' % ' + (this.kind === 'grass' ? 'klippt' : 'dammsuget'), reason === 'done' ? 'klart med ' + Math.round(this.time) + ' s kvar (+' + bonus + ')' : reason === 'time' ? (this.kind === 'grass' ? 'grannen klagade' : 'katten somnade på golvet') : (this.kind === 'grass' ? 'blomrabatten är förstörd' : 'katten vann')];
    setTimeout(() => finishChore({ score: this.score, stars, lines }), 700);
  }
  render(ctx) {
    const cs = this.cs, ox = this.ox, oy = this.oy, W = g.W, H = g.H;
    if (this.kind === 'grass') { ctx.fillStyle = '#2F6B34'; ctx.fillRect(0, 0, W, H); }
    else { ctx.fillStyle = '#C9A06C'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = 'rgba(0,0,0,.08)'; for (let y = 0; y < H; y += 24) ctx.fillRect(0, y, W, 2); }
    for (let y = 0; y < this.rows; y++) for (let x = 0; x < this.cols; x++) {
      const c = this.cells[this.idx(x, y)], px = ox + x * cs, py = oy + y * cs;
      if (this.kind === 'grass') {

      else if (it.type === 'pants') { ctx.moveTo(x - 40, y - 50); ctx.lineTo(x + 40, y - 50); ctx.lineTo(x + 44, y + 50); ctx.lineTo(x + 8, y + 50); ctx.lineTo(x, y - 6); ctx.lineTo(x - 8, y + 50); ctx.lineTo(x - 44, y + 50); ctx.closePath(); }
      else if (it.type === 'dress') { ctx.moveTo(x - 26, y - 52); ctx.lineTo(x + 26, y - 52); ctx.lineTo(x + 20, y - 20); ctx.lineTo(x + 52, y + 52); ctx.lineTo(x - 52, y + 52); ctx.lineTo(x - 20, y - 20); ctx.closePath(); }
      else { ctx.rect(x - 52, y - 40, 104, 80); }
    };
    path(); ctx.fill(); path(); ctx.stroke();
    if (it.type === 'towel') { ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let k = -30; k <= 30; k += 20) ctx.fillRect(x - 52, y + k - 3, 104, 6); }
    if (it.delicate) { C.rrect(ctx, x + 18, y + 14, 40, 26, 5); ctx.fillStyle = '#FFF8EC'; ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke(); C.text(ctx, '🧵', x + 38, y + 27, 16, '#333', 'center', C.F.emoji, false); }
    if (it.holes) { ctx.fillStyle = '#1B1430'; for (const [dx, dy, r] of [[-12, -10, 7], [14, 18, 5], [-4, 30, 4]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2); ctx.fill(); } }
    ctx.restore();
  }
  render(ctx) {
    const W = g.W, H = g.H, cy = H * 0.52;
    ctx.fillStyle = '#2E3D31'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#E9E2D6'; ctx.fillRect(0, 0, W, 100); ctx.fillStyle = '#D6CDBD'; ctx.fillRect(0, 100, W, 6);
    // bins
    const zone = (dir, x, y, w, h, color, label, vertical) => { const f = this.flash && this.flash.dir === dir ? this.flash : null; ctx.save(); C.rrect(ctx, x, y, w, h, 12); ctx.fillStyle = f ? (f.ok ? 'rgba(126,217,87,.55)' : 'rgba(255,107,107,.6)') : 'rgba(255,255,255,.07)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = f ? (f.ok ? '#7ED957' : '#FF6B6B') : color; ctx.stroke(); if (vertical) { ctx.translate(x + w / 2, y + h / 2); ctx.rotate(-Math.PI / 2); C.text(ctx, label, 0, 0, 20, color); } else C.text(ctx, label, x + w / 2, y + h / 2, 18, color); ctx.restore(); };
    zone('left', 10, cy - 110, 48, 220, '#FAFAFA', '⇠ VITT', true); zone('right', W - 58, cy - 110, 48, 220, '#3E7BFF', 'KULÖRT ⇢', true);
    zone('up', W / 2 - 90, 122, 180, 34, '#F9C6D3', 'FINTVÄTT ⇡', false); zone('down', W / 2 - 90, H - 74, 180, 34, '#8A8F98', 'TRASIGT ⇣', false);
    // basket
    ctx.fillStyle = '#A5713A'; C.rrect(ctx, W / 2 - 80, H - 130, 160, 40, 10); ctx.fill();
    if (this.item) { const it = this.item, k = C.easeOut(it.enter), y = cy + (1 - k) * 200; this.drawGarment(ctx, it, W / 2, y); const p = Math.max(0, this.timer / this.timerMax); C.rrect(ctx, W / 2 - 60, y - 76, 120, 10, 5); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fill(); C.rrect(ctx, W / 2 - 60, y - 76, 120 * p, 10, 5); ctx.fillStyle = p < 0.3 ? '#FF6B6B' : '#7ED957'; ctx.fill(); }
    for (const l of this.leaving) { const k = l.t / 0.5, d = l.dir, sp = l.slow ? 160 : 900; const dx = d === 'right' ? sp * l.t : d === 'left' ? -sp * l.t : 0, dy = d === 'up' ? -sp * l.t : d === 'down' ? sp * l.t * 0.6 : 0; ctx.save(); ctx.translate(W / 2 + dx, cy + dy); ctx.rotate((d === 'right' ? 1 : d === 'left' ? -1 : 0) * k * 0.8); ctx.translate(-W / 2, -cy); this.drawGarment(ctx, l, W / 2, cy, 1 - k); ctx.restore(); }
    C.text(ctx, String(this.score), W / 2, 34, 32, '#3B2A1A', 'center', C.F.display, false);
    C.text(ctx, '♥'.repeat(Math.max(0, this.lives)) + '♡'.repeat(Math.max(0, 3 - this.lives)), 16, 34, 22, '#E63946', 'left', C.F.display, false);
    C.text(ctx, 'PLAGG ' + (this.i + 1) + '/' + this.total, W - 16, 34, 14, '#3B2A1A', 'right', C.F.ui, false);
    if (this.combo >= 2) C.text(ctx, 'x' + this.combo, W - 16, 60, 22, '#E63946', 'right', C.F.display, false);
    C.text(ctx, 'MENY', 16, H - 20, 12, 'rgba(255,255,255,.6)', 'left', C.F.ui, false);
  }
  onSwipe(dir) { this.decide(dir); }
  onTap() { if (this.i < 2) C.ui.toast('Swipa plagget till rätt hög', 1200); }
}

// ================================================================ mount & wiring
function update(dt) { if (G.screen === 'play' && G.game) G.game.update(dt); }
function render(ctx) {
  ctx.save(); g.fx.applyShake(ctx);
  if (G.screen === 'play' && G.game) G.game.render(ctx);
  else { const gr = ctx.createLinearGradient(0, 0, 0, g.H); gr.addColorStop(0, '#1F2A22'); gr.addColorStop(1, '#2E3D31'); ctx.fillStyle = gr; ctx.fillRect(0, 0, g.W, g.H); }
  g.fx.draw(ctx); ctx.restore();
}
const g = C.mount({ ariaLabel: 'Sysslor spelplan',
  onTap: (x, y) => { if (G.screen === 'play' && G.game) { if (x < 70 && y > g.H - 40) { goMenu(); return; } if (G.game.onTap) G.game.onTap(x, y); } else if (G.screen === 'over' && performance.now() > G.overReadyAt) { /* wait for buttons */ } },
  onSwipe: (dir) => { if (G.screen === 'play' && G.game && G.game.onSwipe) G.game.onSwipe(dir); },
  onDown: (x, y) => { if (G.screen === 'play' && G.game && G.game.onDown) G.game.onDown(x, y); },
  onMove: (x, y, dx, dy) => { if (G.screen === 'play' && G.game && G.game.onMove) G.game.onMove(x, y, dx, dy); },
  onUp: (x, y) => { if (G.screen === 'play' && G.game && G.game.onUp) G.game.onUp(x, y); },
  update, render,
  onKey: k => { if (k === 'Escape') { goMenu(); return true; } if ((k === ' ' || k === 'Enter') && G.screen === 'intro') { startChore(); return true; } return false; } });
function refreshToggles() { C.ui.setText('bHap', 'Vibration: ' + (C.haptics.on ? 'på' : 'av')); C.ui.setText('bSnd', 'Ljud: ' + (C.audio.on ? 'på' : 'av')); }
$('name0').value = G.names[0] || ''; $('name1').value = G.names[1] || '';
for (const i of [0, 1]) { $('name' + i).addEventListener('input', e => { G.names[i] = e.target.value; S.set('names', G.names); renderHub(); }); $('who' + i).addEventListener('click', () => { G.who = i; S.set('who', i); renderHub(); C.haptics.tap(); }); }
C.ui.bind('bStart', () => { G.screen = 'play'; startChore(); });
C.ui.bind('bIntroBack', goMenu);
C.ui.bind('bNext', () => { const d = dayData(), p = d['p' + G.who] || {}; const next = CHORES.find(c => !(p[c.id] && p[c.id].stars >= 1)); if (next) openIntro(next.id); else goMenu(); });
C.ui.bind('bAgain', () => { C.ui.hideAll(); startChore(); });
C.ui.bind('bShare', share); C.ui.bind('bMenu', goMenu);
C.ui.bind('bHap', () => { C.haptics.on = !C.haptics.on; S.set('haptics', C.haptics.on); refreshToggles(); C.haptics.medium(); });
C.ui.bind('bSnd', () => { C.audio.on = !C.audio.on; S.set('sound', C.audio.on); refreshToggles(); C.audio.blip(1); });
const h = C.hash();
if (h.get('c') && h.get('s')) { G.challenge = { chore: h.get('c'), seed: h.get('s'), score: parseInt(h.get('t') || '0', 10) || 0 }; setTimeout(() => C.ui.toast('Utmaning: slå ' + G.challenge.score + ' p på ' + (CHORES.find(c => c.id === G.challenge.chore) || {}).name, 3000), 300); }
refreshToggles(); renderHub();
window.__G = G;
const boot = () => g.start();
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
